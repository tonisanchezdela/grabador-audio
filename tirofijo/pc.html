    const hint=(r.model!==S.target && !(r.model==='custom'&&!TARGETS[S.target]))?'parece '+detName+'; se mantiene tu configuración':'';
    return {ok:true, model:r.model, name, hint, rmsMM:r.rmsMM};
  }

  /* ---------- un paso: dibuja la diana y analiza el fotograma ---------- */
  function step(){
    if(!setSize()){ octx.clearRect(0,0,overlay.width,overlay.height); return; }
    drawDiana();
    const z=1/(Z.s||1);
    if(S.detectType==='laser'){
      const p=detectRed();
      if(p && p.live){ E.lastLive=performance.now(); octx.beginPath(); octx.arc(p.live.x,p.live.y,12*z,0,7); octx.strokeStyle='#f85149'; octx.lineWidth=3*z; octx.stroke(); }
      if(p && p.shot && E.armed){ const now=performance.now()/1000;
        if(now-S.lastShot>S.cooldown){ S.lastShot=now; registerShot(p.shot.x,p.shot.y); } }
    } else {
      const hs=detectHole(), st=HD.state||'wait', now=performance.now();
      if((st==='mov'||st==='wait') && now-(E.lastMovSeen||0)>1500) E.lastMov=now;
      if(st==='mov'||st==='wait') E.lastMovSeen=now;
      if(E.armed && S.askShot!==false) watchShot(st, hs);
      if(hs) hs.forEach(h=>{ HD.recent.push({rx:h.q.rx, ry:h.q.ry, t:performance.now()});
        if(E.armed){ S.lastShot=performance.now()/1000; registerShot(h.pt.x,h.pt.y,h.big?{big:true}:null);
          if(h.big && !HD.bigWarned){ HD.bigWarned=true; if(E.onBig) try{ E.onBig(); }catch(e){} } } });
    }
  }

  // (v25.9) «¿disparo?»: la tarjeta se mueve (como con un impacto) pero no aparece agujero nuevo
  const ASK={evt:null, okOff:null};
  function watchShot(st, hs){
    const now=performance.now();
    if(st==='gone'){ ASK.evt=null; ASK.okOff=null; return; }            // (v26.6) diana girada: nada que preguntar
    if(hs&&hs.length){ ASK.evt=null; return; }
    if(st==='ok'){
      if(ASK.evt && !ASK.evt.back) ASK.evt.back=now;
      if(ASK.evt && now-ASK.evt.back>4000){
        const o=HD.lastOff||{x:0,y:0}, d=Math.hypot(o.x-ASK.evt.off.x,o.y-ASK.evt.off.y)/HD.RR*targetD()/2;
        const n0=ASK.evt.n; ASK.evt=null;
        if(d>=0.25 && S.shots.length===n0 && E.onAsk) try{ E.onAsk(d); }catch(e){}
      }
      if(!ASK.evt) ASK.okOff={x:(HD.lastOff||{x:0}).x, y:(HD.lastOff||{y:0}).y};
    } else if((st==='mov'||st==='wait') && !ASK.evt && ASK.okOff){
      ASK.evt={t:now, off:ASK.okOff, n:S.shots.length};
    } else if(st==='cand' && ASK.evt){ ASK.evt.back=0; }
  }
  // disparo fuera de la tarjeta: cuenta como 0
  function addZero(){ if(!S.W) return null; const p=normToScreen(1.2,0);
    return registerShot(p.x,p.y,{manual:true, ring:0, dec:0, vx:null, vy:null}); }

  function status(){
    if(!video.videoWidth) return {st:'off', txt:'Sin imagen'};
    if(S.detectType==='laser') return performance.now()-E.lastLive<300 ? {st:'cand', txt:'🔴 Punto láser'} : {st:'ok', txt:'🔴 Láser listo'};
    const st=HD.state||'wait';
    return {st, txt: st==='mov'?'✋ Movimiento': st==='gone'?'↻ Diana girada': st==='cand'?'◎ Impacto…': st==='ok'?'● Diana lista':'… Estabilizando'};
  }
  function totals(){
    markBest(); const n=S.shots.length, cs=counted(), sum=cs.reduce((a,s)=>a+s.dec,0), sumInt=cs.reduce((a,s)=>a+s.ring,0);
    return {n, counted:cs.length, sum:Math.round(sum*10)/10, sumInt, last:n?S.shots[n-1]:null, x:cs.filter(s=>s.dRel<=xRadius()).length};
  }
  function save(){ const o={}; SAVE_KEYS.forEach(k=>o[k]=S[k]); return JSON.parse(JSON.stringify(o)); }
  function load(o){ if(!o) return; SAVE_KEYS.forEach(k=>{ if(o[k]!==undefined) S[k]=o[k]; }); buildPersp(); rescoreAll(); resetHoles(); }
  // punto del lienzo (coordenadas CSS dentro del elemento) -> coordenadas del lienzo de trabajo
  function cssToCanvas(cx,cy){ const cw=overlay.clientWidth, ch=overlay.clientHeight, sc=Math.min(cw/S.W, ch/S.H);
    return {x:(cx-(cw-S.W*sc)/2)/sc, y:(cy-(ch-S.H*sc)/2)/sc}; }
  function addShotCss(cx,cy){ if(!S.W) return null; const p=cssToCanvas(cx,cy);
    if(FX.sug&&FX.sug.length){ const c0=normToScreen(0,0), e1=normToScreen(1,0), Rs=Math.hypot(e1.x-c0.x,e1.y-c0.y), lim=Math.max(bulletR()*Rs*2.5, 26/(Z.s||1));
      let bi=-1,bd=1e9; FX.sug.forEach((o,i)=>{ const q=normToScreen(o.rx,o.ry), d=Math.hypot(q.x-p.x,q.y-p.y); if(d<bd){bd=d;bi=i;} });
      if(bi>=0&&bd<=lim){ const s={...FX.sug[bi]}; S.shots.push(s); FX.sug.splice(bi,1); markBest(); if(E.changed) try{ E.changed(); }catch(e){} return s; } }
    const prevT=S.shots.length?S.shots[S.shots.length-1].t:Date.now();
    const s=registerShot(p.x,p.y,{manual:true}); if(S.phase==='review') s.t=prevT; return s; }
  function delNearCss(cx,cy){ if(!S.W||!S.shots.length) return null; const p=cssToCanvas(cx,cy); let bi=-1,bd=1e9;
    S.shots.forEach((s,i)=>{ const q=normToScreen(s.rx,s.ry), d=Math.hypot(q.x-p.x,q.y-p.y); if(d<bd){ bd=d; bi=i; } });
    if(bi<0||bd>40/(Z.s||1)) return null; const s=S.shots.splice(bi,1)[0]; markBest(); return s; }

  Object.assign(E,{ parseCal, step, status, totals, save, load, setTarget, setModal, setDetect, setAroCal, targetCenterVid, targetD, autoCalib:runAutoCalib, ringRadii, scoreShot,
    clear(){ S.shots=[]; HD.recent=[]; resetHoles(); ASK.evt=null; ASK.okOff=null; FX.A=null; FX.res=null; FX.sug=[]; FX.msg=''; S.phase='idle'; }, addZero,
    // sesión: «running» mientras se tira; «review» al terminar (números, recuperados y dudosos a la vista)
    async sessionStart(){ S.phase='running'; HD.cands=[]; HD.recent=[]; E.lastMov=0; FX.res=null; FX.sug=[]; FX.A=null;
      // la foto inicial necesita la zona de la diana ya preparada por la detección: se espera un momento si aún no está
      for(let k=0;k<50 && S.fxOn!==false && S.detectType==='holes' && !(HD.R&&HD.ins&&HD.ins.length===HD.R.w*HD.R.h);k++) await fxSleep(200);
      if(S.phase!=='running') return;
      try{ await fxStart(); }catch(e){ FX.A=null; } },
    sessionEnd(){ S.phase='review'; if(FX.A) return fxRun().catch(()=>fxUI('🔬 Análisis final: error')); fxUI(''); return Promise.resolve(); },
    fx:FX, fxRedo(){ S.phase='review'; return fxRun(); }, fxUndo(){ fxApply(null); fxUI(''); }, fxAddSug(){ if(FX.res) fxApply(FX.res,true); },
    fxTakePhoto, markBest, undo(){ const s=S.shots.pop(); markBest(); return s; },
    resetRef(){ resetHoles(); LZ.base=null; }, holeInfo(){ return HD.info||''; }, addShotCss, delNearCss, xRadius, blackRadius, bulletR });
  return E;
}

// Autocalibrado de la diana: encuentra la zona negra, los aros y la perspectiva a partir de una imagen.
// autoCalib(rgba, W, H, TARGETS) -> {ok, model, k, H (px imagen -> coords normalizadas, radio exterior = 1),
//                                    rings:[{r, n}], rmsMM, msg}
function autoCalib(rgba, W, H, TARGETS){
  const N=W*H, g=new Float32Array(N);
  for(let i=0,j=0;i<N;i++,j+=4) g[i]=0.299*rgba[j]+0.587*rgba[j+1]+0.114*rgba[j+2];

  // ---------- 1. zona negra: umbral de Otsu + cierre morfológico + mancha oscura más "redonda y llena" ----------
  const hist=new Float64Array(256); for(let i=0;i<N;i++) hist[g[i]|0]++;
  let sum=0; for(let i=0;i<256;i++) sum+=i*hist[i];
  let wB=0, sB=0, best=0, thr=100;
  for(let t=0;t<256;t++){ wB+=hist[t]; if(!wB) continue; const wF=N-wB; if(!wF) break; sB+=t*hist[t];
    const mB=sB/wB, mF=(sum-sB)/wF, v=wB*wF*(mB-mF)*(mB-mF); if(v>best){ best=v; thr=t; } }
  // segundo Otsu dentro de lo oscuro: separa el negro de la diana de fondos grises (pared, cartón)
  let thr2=thr; { let n2=0,s2=0; for(let i=0;i<thr;i++){ n2+=hist[i]; s2+=i*hist[i]; }
    let w=0,sb=0,bv=0; for(let t=0;t<thr;t++){ w+=hist[t]; if(!w) continue; const wf=n2-w; if(!wf) break; sb+=t*hist[t];
      const a=sb/w, b=(s2-sb)/wf, v=w*wf*(a-b)*(a-b); if(v>bv){ bv=v; thr2=t; } } }
  const rad=Math.max(1,Math.round(Math.min(W,H)/320));            // cierra las líneas blancas finas de la zona negra
  const box=(src,val)=>{ // dilata (val=1) o erosiona (val=0) con una caja de (2·rad+1)
    const a=new Uint8Array(N), b=new Uint8Array(N);
    for(let y=0;y<H;y++){ let c=0; const o=y*W;
      for(let x=-rad;x<W+rad;x++){ const xi=x+rad; if(xi<W) c+=(src[o+xi]===val)?1:0; const xo=x-rad-1; if(xo>=0) c-=(src[o+xo]===val)?1:0;
        if(x>=0&&x<W) a[o+x]=c>0?val:1-val; } }
    for(let x=0;x<W;x++){ let c=0;
      for(let y=-rad;y<H+rad;y++){ const yi=y+rad; if(yi<H) c+=(a[yi*W+x]===val)?1:0; const yo=y-rad-1; if(yo>=0) c-=(a[yo*W+x]===val)?1:0;
        if(y>=0&&y<H) b[y*W+x]=c>0?val:1-val; } }
    return b; };
  const lab=new Int32Array(N), stack=new Int32Array(N);
  let bc=null, bs=0;
  for(const th of (thr2<thr-15?[thr,thr2]:[thr])){
    let m=new Uint8Array(N); for(let i=0;i<N;i++) m[i]=g[i]<th?1:0;
    m=box(box(m,1),0);
    lab.fill(-1); const comps=[];
    for(let s=0;s<N;s++){ if(!m[s]||lab[s]>=0) continue;
      let sp=0; stack[sp++]=s; const id=comps.length; lab[s]=id;
      let n=0,sx=0,sy=0,sxx=0,syy=0,sxy=0,touch=0,sg=0,x0=W,x1=0,y0=H,y1=0;
      while(sp){ const i=stack[--sp], x=i%W, y=(i-x)/W; n++; sx+=x; sy+=y; sxx+=x*x; syy+=y*y; sxy+=x*y; sg+=g[i];
        if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
        if(x===0||y===0||x===W-1||y===H-1) touch++;
        if(x>0&&m[i-1]&&lab[i-1]<0){lab[i-1]=id;stack[sp++]=i-1;}
        if(x<W-1&&m[i+1]&&lab[i+1]<0){lab[i+1]=id;stack[sp++]=i+1;}
        if(y>0&&m[i-W]&&lab[i-W]<0){lab[i-W]=id;stack[sp++]=i-W;}
        if(y<H-1&&m[i+W]&&lab[i+W]<0){lab[i+W]=id;stack[sp++]=i+W;} }
      comps.push({id,n,sx,sy,sxx,syy,sxy,touch,mean:sg/n,x0,x1,y0,y1}); }
    for(const c of comps){ if(c.n<0.003*N) continue;
      const mx=c.sx/c.n, my=c.sy/c.n, cxx=c.sxx/c.n-mx*mx, cyy=c.syy/c.n-my*my, cxy=c.sxy/c.n-mx*my;
      const tr=(cxx+cyy)/2, dd=Math.sqrt(((cxx-cyy)/2)**2+cxy*cxy), l1=tr+dd, l2=Math.max(1e-9,tr-dd);
      const a=2*Math.sqrt(l1), b=2*Math.sqrt(l2), phi=0.5*Math.atan2(2*cxy,cxx-cyy);
      if(b/a<0.35) continue;
      // parecido a una elipse llena: intersección / unión con su elipse de momentos
      const cp=Math.cos(phi), sp2=Math.sin(phi); let inE=0, inC=0, ae=0;
      const X0=Math.max(0,Math.floor(mx-a-2)), X1=Math.min(W-1,Math.ceil(mx+a+2)), Y0=Math.max(0,Math.floor(my-a-2)), Y1=Math.min(H-1,Math.ceil(my+a+2));
      for(let y=Y0;y<=Y1;y++) for(let x=X0;x<=X1;x++){ const dx=x-mx, dy=y-my, u=(dx*cp+dy*sp2)/a, v=(-dx*sp2+dy*cp)/b, ins=u*u+v*v<=1;
        if(ins){ ae++; if(lab[y*W+x]===c.id) inE++; } }
      const iou=inE/(c.n+ae-inE);
      if(iou<0.75) continue;
      const touchF=c.touch>0.02*Math.sqrt(c.n)?0.15:1;
      const sc=Math.sqrt(c.n)*Math.pow(iou,4)*(1-c.mean/255)*touchF;
      if(sc>bs){ bs=sc; bc={mx,my,a,b,phi,iou,mean:c.mean}; } }
  }
  if(!bc) return {ok:false, msg:'No encuentro la zona negra de la diana. Comprueba que se ve entera y bien iluminada.'};

  // ---------- 2. perfiles radiales: líneas de los aros (oscuras fuera de la zona negra, claras dentro) ----------
  const cph=Math.cos(bc.phi), sph=Math.sin(bc.phi);
  const e1=[cph*bc.a, sph*bc.a], e2=[-sph*bc.b, cph*bc.b];
  const samp=(x,y)=>{ if(x<0||y<0||x>W-1.001||y>H-1.001) return NaN; const x0=x|0, y0=y|0, fx=x-x0, fy=y-y0, i=y0*W+x0;
    return (g[i]*(1-fx)+g[i+1]*fx)*(1-fy)+(g[i+W]*(1-fx)+g[i+W+1]*fx)*fy; };
  const NR=240, S0=0.06, S1=3.3, DS=0.0035, NS=Math.round((S1-S0)/DS)+1;
  const rays=[]; const valid=new Float32Array(NS);
  for(let q=0;q<NR;q++){
    const th=2*Math.PI*q/NR, ux=Math.cos(th), uy=Math.sin(th);
    const dx=ux*e1[0]+uy*e2[0], dy=ux*e1[1]+uy*e2[1], pxPerS=Math.hypot(dx,dy);
    const I=new Float32Array(NS); for(let k=0;k<NS;k++){ const s=S0+k*DS; I[k]=samp(bc.mx+s*dx, bc.my+s*dy); if(!isNaN(I[k])) valid[k]++; }
    const w=Math.max(2,Math.round(2.5/(DS*pxPerS)));
    const med=(lo,hi)=>{ const v=[]; for(let k=Math.round((lo-S0)/DS);k<=Math.round((hi-S0)/DS);k++) if(k>=0&&k<NS&&!isNaN(I[k])) v.push(I[k]); v.sort((a,b)=>a-b); return v.length?v[v.length>>1]:NaN; };
    const wh=med(1.08,1.3), bl=med(0.45,0.9), con=Math.abs(wh-bl);
    const thrR=Math.max(4,0.12*(isNaN(con)?40:con));
    const L=new Float32Array(NS);
    for(let k=w;k<NS-w;k++){ const s=S0+k*DS, a=I[k-w], b=I[k+w], c=I[k]; if(isNaN(a)||isNaN(b)||isNaN(c)) continue;
      L[k]= s>1.03 ? (a+b)/2-c : (s<0.97 ? c-(a+b)/2 : 0); }
    const peaks=[];
    for(let k=w;k<NS-w;k++){ if(L[k]<thrR) continue; let mx=true; const h=Math.max(1,w>>1);
      for(let j=1;j<=h;j++) if(L[k-j]>L[k]||L[k+j]>=L[k]){ mx=false; break; } if(!mx) continue;
      const y0=L[k-1], y1=L[k], y2=L[k+1], den=y0-2*y1+y2, off=den<0?0.5*(y0-y2)/den:0;
      peaks.push(S0+(k+off)*DS); }
    // borde de la zona negra: mayor subida de brillo entre s=0.8 y 1.2
    let eb=-1, ev=0; for(let k=Math.round((0.8-S0)/DS);k<=Math.round((1.2-S0)/DS);k++){ if(k-w<0||k+w>=NS) continue;
      const d=I[k+w]-I[k-w]; if(!isNaN(d)&&d>ev){ ev=d; eb=S0+k*DS; } }
    rays.push({dx,dy,peaks,edge: ev>Math.max(8,0.3*(isNaN(con)?40:con))?eb:null});
  }
  // ---------- 3. cadenas: cada aro es una curva continua de picos de rayo en rayo ----------
  const chains=[]; let open=[];
  for(let q=0;q<NR;q++){
    const pk=rays[q].peaks, used=new Uint8Array(pk.length), nx=[];
    open.sort((a,b)=>a.last-b.last);
    for(const ch of open){ let bi=-1, bd=0.022+0.012*ch.last;
      for(let i=0;i<pk.length;i++){ if(used[i]) continue; const d=Math.abs(pk[i]-ch.last); if(d<bd){ bd=d; bi=i; } }
      if(bi>=0){ used[bi]=1; ch.pts.push({q,s:pk[bi]}); ch.last=pk[bi]; ch.gap=0; nx.push(ch); }
      else if(ch.gap<4){ ch.gap++; nx.push(ch); } }
    for(let i=0;i<pk.length;i++) if(!used[i]){ const ch={pts:[{q,s:pk[i]}], last:pk[i], gap:0}; chains.push(ch); nx.push(ch); }
    open=nx; }
  // une las cadenas que dan la vuelta completa (fin cerca del rayo NR-1 con principio cerca del 0)
  for(const a of chains){ if(a.dead) continue; const qe=a.pts[a.pts.length-1].q; if(qe<NR-5) continue;
    for(const b of chains){ if(b===a||b.dead) continue; if(b.pts[0].q>4) continue;
      if(Math.abs(b.pts[0].s-a.pts[a.pts.length-1].s)<0.03+0.012*b.pts[0].s){ a.pts=a.pts.concat(b.pts); b.dead=true; break; } } }
  const good=chains.filter(c=>!c.dead && new Set(c.pts.map(p=>p.q)).size>=0.25*NR)
    .map(c=>({pts:c.pts, s:c.pts.map(p=>p.s).sort((a,b)=>a-b)[c.pts.length>>1]})).sort((a,b)=>a.s-b.s);
  const edgePts=rays.map((r,q)=>r.edge!=null?{q,s:r.edge}:null).filter(Boolean);
  if(good.length<2 || edgePts.length<0.25*NR)
    return {ok:false, msg:'No distingo los aros de la diana. Acerca la cámara o mejora la luz frontal.', dbg:{bc, nch:good.length, ne:edgePts.length}};

  // ---------- 4. homografía con radios libres por aro (corrige la perspectiva sin saber aún el modelo) ----------
  const sc=bc.a, cx=bc.mx, cy=bc.my;
  const toXY=(q,s)=>{ const r=rays[q]; return {x:(bc.mx+s*r.dx-cx)/sc, y:(bc.my+s*r.dy-cy)/sc}; };
  const groups=[{fixed:1, pts:edgePts.map(p=>toXY(p.q,p.s))}].concat(good.map(c=>({fixed:null, s0:c.s, pts:c.pts.map(p=>toXY(p.q,p.s))})));
  const gauss=(M,v)=>{ const n=v.length, A=M.map((r,i)=>r.concat([v[i]]));
    for(let c=0;c<n;c++){ let pr=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[pr][c])) pr=r;
      if(Math.abs(A[pr][c])<1e-15) return null; [A[c],A[pr]]=[A[pr],A[c]];
      for(let r=0;r<n;r++){ if(r===c) continue; const f=A[r][c]/A[c][c]; for(let k=c;k<=n;k++) A[r][k]-=f*A[c][k]; } }
    return A.map((r,i)=>r[n]/r[i]); };
  // params: 8 de la homografía + un radio por grupo libre. residuo = |H(p)| - R
  function makeRes(G){ return pp=>{ const out=[]; let fi=8;
    for(const gr of G){ const R=gr.fixed!=null?gr.fixed:pp[fi++];
      for(const q of gr.pts){ const w=pp[6]*q.x+pp[7]*q.y+1; out.push(Math.hypot((pp[0]*q.x+pp[1]*q.y+pp[2])/w,(pp[3]*q.x+pp[4]*q.y+pp[5])/w)-R); } }
    return out; }; }
  function lm(pp,resf,iters){
    let mu=1e-3, r=resf(pp), c=r.reduce((a,v)=>a+v*v,0); const n=pp.length;
    for(let it=0;it<iters;it++){
      const J=[]; for(let j=0;j<n;j++){ const q=pp.slice(), h=1e-6*Math.max(1e-3,Math.abs(pp[j])); q[j]+=h; const r2=resf(q); J.push(r2.map((v,i)=>(v-r[i])/h)); }
      const A=[...Array(n)].map(()=>new Array(n).fill(0)), gv=new Array(n).fill(0);
      for(let a=0;a<n;a++){ for(let b=a;b<n;b++){ let s=0; const Ja=J[a], Jb=J[b]; for(let i=0;i<r.length;i++) s+=Ja[i]*Jb[i]; A[a][b]=A[b][a]=s; }
        let s=0; for(let i=0;i<r.length;i++) s+=J[a][i]*r[i]; gv[a]=s; }
      let improved=false;
      for(let tries=0;tries<8;tries++){
        const M=A.map((row,i)=>{ const rr=row.slice(); rr[i]+=mu*(row[i]+1e-12); return rr; });
        const d=gauss(M,gv.map(v=>-v)); if(!d){ mu*=10; continue; }
        const q=pp.map((v,i)=>v+d[i]), r2=resf(q), c2=r2.reduce((a,v)=>a+v*v,0);
        if(c2<c){ const rel=(c-c2)/c; pp=q; r=r2; c=c2; mu=Math.max(1e-9,mu/3); improved=true; if(rel<1e-10) it=iters; break; }
        mu*=8; }
      if(!improved) break; }
    return {p:pp, r, c}; }
  const trimG=(G,r)=>{ const a=r.map(Math.abs).sort((x,y)=>x-y), lim=Math.max(3*1.4826*a[a.length>>1], 0.003); let i=0;
    return G.map(gr=>({...gr, pts:gr.pts.filter(()=>Math.abs(r[i++])<=lim)})).filter(gr=>gr.pts.length>=8); };
  let p0=[cph/bc.a*sc, sph/bc.a*sc, 0, -sph/bc.b*sc, cph/bc.b*sc, 0, 0, 0].concat(good.map(c=>c.s));
  let G=groups, fit=lm(p0,makeRes(G),60);
  const keep=fit.p.slice(8); G=G.map((gr,i)=>i?{...gr, s0:keep[i-1]}:gr);
  G=trimG(G,fit.r); fit=lm(fit.p.slice(0,8).concat(G.slice(1).map(gr=>gr.s0)),makeRes(G),60);
  const rho=fit.p.slice(8);                         // radio de cada aro / radio de la zona negra (sin perspectiva)

  // ---------- 5. modelo de diana que encaja con esos radios ----------
  let bestM=null;
  for(const [key,t] of Object.entries(TARGETS)){
    const xs=t.r.slice(1).map(d=>d/t.black);
    for(let k=0.93;k<=1.0701;k+=0.0025){      // escala libre: el borde de la zona negra puede salir algo desplazado
      let mt=0, se=0; const asg=[];
      for(const r of rho){ let bj=-1, bd=1; xs.forEach((x,j)=>{ if(x<0.1||Math.abs(x-1)<0.03) return; const d=Math.abs(Math.log(r/(k*x))); if(d<bd){ bd=d; bj=j; } });
        if(bd<0.02){ mt++; se+=bd*bd; asg.push(bj+1); } else asg.push(0); }
      const sc2=mt - Math.sqrt(se/Math.max(1,mt))*40 - Math.abs(Math.log(k))*5;
      if(!bestM || sc2>bestM.sc) bestM={key,t,mt,sc:sc2,asg,k}; } }
  let model, t, asg;
  if(bestM && bestM.mt>=2 && bestM.mt>=0.6*rho.length){ model=bestM.key; t=bestM.t; asg=bestM.asg; }
  else {   // desconocida: aros iguales, el más exterior es el borde
    const all=[1].concat(rho).sort((a,b)=>a-b), ds=[]; for(let i=1;i<all.length;i++) ds.push(all[i]-all[i-1]); ds.sort((a,b)=>a-b);
    const sp=ds[ds.length>>1], outer=all[all.length-1], n=Math.max(3,Math.min(12,Math.round(outer/sp)));
    const r=[0]; for(let v=1;v<=n;v++) r.push((n-v+1)/n);
    t={D:1, r, black:1/outer, n}; model='custom';
    asg=rho.map(x=>{ const v=n+1-Math.round(x/outer*n); return v>=1&&v<=n?v:0; }); }
  const D=t.D;
  // ---------- 6. ajuste final con los radios reales del modelo ----------
  let GF=[];
  G.slice(1).forEach((gr,i)=>{ const v=asg[i]; if(v>0) GF.push({fixed:t.r[v]/D, pts:gr.pts}); });
  if(GF.length<3) GF.unshift({fixed:t.black/D, pts:G[0].pts});   // el borde negro solo si hay pocos aros
  const k0=t.black/D/(bestM&&bestM.k||1);   // de unidades de "zona negra" a radio exterior = 1
  let pf=fit.p.slice(0,8); pf=[pf[0]*k0,pf[1]*k0,pf[2]*k0,pf[3]*k0,pf[4]*k0,pf[5]*k0,pf[6],pf[7]];
  let ff=lm(pf,makeRes(GF),60); GF=trimG(GF,ff.r); ff=lm(ff.p,makeRes(GF),60);
  const npts=GF.reduce((a,g)=>a+g.pts.length,0), rms=Math.sqrt(ff.c/npts);
  const q=ff.p, Hs=[[q[0],q[1],q[2]],[q[3],q[4],q[5]],[q[6],q[7],1]], T=[[1/sc,0,-cx/sc],[0,1/sc,-cy/sc],[0,0,1]];
  const Hpx=[]; for(let r=0;r<3;r++) for(let c=0;c<3;c++){ let s=0; for(let k=0;k<3;k++) s+=Hs[r][k]*T[k][c]; Hpx.push(s); }
  return {ok:true, model, n:t.n||10, H:Hpx, rmsMM:model==='custom'?0:rms*D/2, rmsN:rms, rings:GF.length, pts:npts, black:bc, rho, asg, k:1, ng:G.map(g=>g.pts.length)};
}

window.TirofijoMotor={create, TARGETS, MODALS, autoCalib};
})();

</script>
<script>
(() => {
  const PCVER='v1.5', PCDATE='28-11-26';    // versión visible: cambiar en cada versión
  const $=s=>document.querySelector(s);
  $('#appVer').textContent='Versión '+PCVER+' · actualizada el '+PCDATE;
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const LS=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } };
  const f1=v=>(Math.round(v*10)/10).toFixed(1).replace('.',',');
  const log=t=>{ const el=$('#log'); el.textContent=(new Date().toLocaleTimeString()+'  '+t+'\n'+el.textContent).slice(0,5000); };
  const say=(t,err)=>{ const s=$('#state'); s.textContent=t; s.classList.toggle('err',!!err); if(err) $('#cfg').classList.remove('hide'); };
  if(!window.TirofijoMotor){ say('Error interno: falta el motor',1); return; }
  const {TARGETS, MODALS}=TirofijoMotor;

  const servedByG2r = location.port==='1984';
  $('#g2r').value = LS('pc_g2r') || LS('galeria_g2r') || (servedByG2r ? location.origin : 'http://localhost:1984');
  $('#colsSel').value = LS('pc_cols') || '0';

  const P=[];     // puestos: {id, key, label, src:{kind,name|deviceId}, el, video, canvas, m, stream, pc, …}
  let seq=0;

  /* ---------- vídeo ---------- */
  async function pullG2r(src){
    const base=$('#g2r').value.replace(/\/$/,'');
    const pc=new RTCPeerConnection({iceServers:[]});
    pc.addTransceiver('video',{direction:'recvonly'});
    const ms=new MediaStream(); pc.ontrack=e=>ms.addTrack(e.track);
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise(r=>{ if(pc.iceGatheringState==='complete') return r();
      const t=setTimeout(r,1500); pc.addEventListener('icegatheringstatechange',()=>{ if(pc.iceGatheringState==='complete'){ clearTimeout(t); r(); } }); });
    const res=await fetch(base+'/api/webrtc?src='+encodeURIComponent(src),{method:'POST',headers:{'Content-Type':'application/sdp'},body:pc.localDescription.sdp});
    if(!res.ok){ pc.close(); throw new Error('go2rtc '+res.status); }
    await pc.setRemoteDescription({type:'answer',sdp:await res.text()});
    await new Promise((ok,ko)=>{ const t=setTimeout(()=>ko(new Error('sin imagen')),8000);
      const chk=()=>{ if(ms.getVideoTracks().length){ clearTimeout(t); ok(); } }; pc.addEventListener('track',chk); chk(); });
    return {pc, stream:ms};
  }
  async function connect(p){
    if(p.connecting) return; p.connecting=true; msg(p,'Conectando…');
    try{
      closeMedia(p);
      if(p.src.kind==='g2r'){ const g=await pullG2r(p.src.name); p.pc=g.pc; p.stream=g.stream;
        p.pc.addEventListener('iceconnectionstatechange',()=>{ if(['failed','closed','disconnected'].includes(p.pc&&p.pc.iceConnectionState)) p.stallSince=p.stallSince||performance.now(); }); }
      else { p.stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:p.src.deviceId?{exact:p.src.deviceId}:undefined, width:{ideal:1920}, height:{ideal:1080}}, audio:false}); }
      p.video.srcObject=p.stream; await p.video.play().catch(()=>{});
      p.lastT=-1; p.stallSince=0; p.fails=0; msg(p,''); log(p.label+': imagen conectada');
      if(p.recWanted && !p.rec && p.m.armed) recStart(p);      // la grabación sigue en otro archivo
    }catch(e){ p.fails=(p.fails||0)+1; msg(p,'Sin imagen: '+e.message+' · reintento en '+Math.min(30,3*p.fails)+' s'); log(p.label+': '+e.message);
      p.retryAt=performance.now()+Math.min(30000,3000*p.fails); }
    finally{ p.connecting=false; }
  }
  function closeMedia(p){
    if(p.rec){ try{ p.rec.rec.stop(); }catch(e){} }    // guarda lo grabado hasta aquí
    try{ p.pc&&p.pc.close(); }catch(e){} p.pc=null;
    if(p.stream && p.src.kind==='cam') p.stream.getTracks().forEach(t=>t.stop());
    p.stream=null; if(p.video) p.video.srcObject=null;
  }
  // vigilancia: si la imagen se congela o el enlace cae, se vuelve a conectar sola
  setInterval(()=>{ const now=performance.now();
    P.forEach(p=>{ if(p.connecting) return;
      if(!p.stream){ if(!p.retryAt||now>=p.retryAt) connect(p); return; }
      const t=p.video.currentTime;
      if(t!==p.lastT){ p.lastT=t; p.stallSince=0; if(p.msgTxt&&p.msgTxt.startsWith('Imagen congelada')) msg(p,''); return; }
      if(!p.stallSince) p.stallSince=now;
      if(now-p.stallSince>6000){ msg(p,'Imagen congelada: reconectando…'); log(p.label+': imagen congelada, reconecto'); p.retryAt=0; connect(p); }
    }); },2000);

  /* ---------- foto para el análisis final (v26.7): webcam → ImageCapture a máxima resolución; cámara IP → instantánea de go2rtc ---------- */
  // (v1.5) cámara IP: primero la FOTO de la propia cámara (resolución completa del sensor, sin compresión de vídeo),
  // que go2rtc trae de su enlace de foto con la entrada «<puesto> foto» de go2rtc.yaml; si no hay, un fotograma del vídeo (necesita ffmpeg)
  async function g2rJpeg(src,ms){
    const base=$('#g2r').value.replace(/\/$/,''), ac=new AbortController(), tm=setTimeout(()=>ac.abort(),ms);
    try{ const r=await fetch(base+'/api/frame.jpeg?src='+encodeURIComponent(src),{signal:ac.signal, cache:'no-store'}); clearTimeout(tm);
      if(r.ok){ const b=await r.blob(); if(b.size>2000) return b; } }catch(e){ clearTimeout(tm); }
    return null;
  }
  async function capturePhoto(p){
    if(p.src.kind==='cam'){ const t=p.stream&&p.stream.getVideoTracks()[0]; return t?p.m.fxTakePhoto(t):null; }
    if(p.src.kind!=='g2r') return null;
    if(p.photoSrc){ const b=await g2rJpeg(p.photoSrc,10000);
      if(b){ if(!p.photoOk){ p.photoOk=true; log(p.label+': foto de la cámara para el análisis ('+Math.round(b.size/1024)+' kB)'); } photoInfo(p); return b; }
      log(p.label+': la cámara no dio la foto («'+p.photoSrc+'»): revisa su enlace de foto en go2rtc.yaml'); p.photoOk=false; photoInfo(p,'⚠ La cámara no dio la foto: revisa «'+p.photoSrc+'» en go2rtc.yaml'); }
    if(!p.noSnap){ const b=await g2rJpeg(p.src.name,5000); if(b) return b;
      p.noSnap=true; log(p.label+': sin foto de la cámara ni instantánea de go2rtc (le falta ffmpeg): el análisis usa la media de fotogramas del vídeo'); }
    return null;
  }
  function photoInfo(p,t){ const e=p.el&&p.el.querySelector('.qcamT'); if(!e||p.src.kind!=='g2r') return;
    e.textContent=t||('Enfoque y exposición se ajustan en la propia cámara IP. '+(p.photoSrc?'Foto para el análisis final: «'+p.photoSrc+'» (resolución completa de la cámara).'
      :'Sin enlace de foto: añade «'+p.src.name+' foto» en go2rtc.yaml para analizar con la foto de la cámara.')); }
  /* ---------- puestos ---------- */
  function cfgKey(p){ return 'tirofijo_pc_'+p.key; }
  function persist(p){ try{ LS(cfgKey(p), JSON.stringify({m:p.m.save(), shooter:p.shooter||''})); }catch(e){} }
  function addPuesto(src, label){
    const key=src.kind==='g2r' ? 'g2r:'+src.name : 'cam:'+(src.label||src.deviceId);
    if(P.some(p=>p.key===key)) return;
    const el=$('#tileTpl').content.firstElementChild.cloneNode(true);
    const p={id:++seq, key, src, label:label||src.name, el, video:el.querySelector('video'), canvas:el.querySelector('canvas')};
    p.m=TirofijoMotor.create(p.video, p.canvas);
    try{ const o=JSON.parse(LS(cfgKey(p))||'null'); if(o){ p.m.load(o.m); p.shooter=o.shooter||''; } }catch(e){}
    p.m.onShot=sh=>onShot(p,sh);
    // número máximo de disparos alcanzado: la tirada del puesto se cierra sola (en la común, cuando acaban todos, termina el programa)
    p.m.onEnd=()=>{ msg(p,'Tirada completa ('+p.m.S.shotLimit+' disparos)'); setTimeout(()=>{ if(p.msgTxt&&p.msgTxt.startsWith('Tirada completa')) msg(p,''); },5000);
      if(p.inProg){ leaveProg(p); if(GP.on && !progParts().length) endProgram(); else hudUI(); }
      else { p.preOk=false; p.m.sessionEnd().then(()=>{ recStop(p); paint(p); persist(p); }); }
      paint(p); };
    p.m.onAsk=()=>askOpen(p);
    p.m.onFx=t=>{ const e=p.el.querySelector('.fxMsg'); if(e) e.textContent=t; if(t) msg(p,t); };
    p.m.changed=()=>{ paint(p); persist(p); };
    p.m.capturePhoto=()=>capturePhoto(p);
    el.dataset.id=p.id;
    el.querySelector('.src').textContent=src.kind==='g2r'?src.name:'webcam';
    const sh=el.querySelector('.shooter'); sh.value=p.shooter||''; sh.oninput=()=>{ p.shooter=sh.value; persist(p); };
    // selectores de la vista ampliada
    const st=el.querySelector('.selTarget');
    st.innerHTML=Object.entries(TARGETS).map(([k,t])=>'<option value="'+k+'">'+esc(t.name)+'</option>').join('')+'<option value="custom">Personalizada</option>';
    st.onchange=()=>{ p.m.setTarget(st.value); preFill(p); persist(p); paint(p); };
    const sm=el.querySelector('.selModal');
    sm.innerHTML=Object.entries(MODALS).map(([k,t])=>'<option value="'+k+'">'+esc(t.name)+'</option>').join('');
    sm.onchange=()=>{ p.m.setModal(sm.value); preFill(p); persist(p); paint(p); };
    const ss=el.querySelector('.selSens'); ss.oninput=()=>{ p.m.S.holeSens=+ss.value; persist(p); paint(p); };
    // diámetro real del aro 1 y calibre (v25.6): se confirman antes de cada sesión
    [['.qAro','.qAroMm'],['.qCal','.qCalMm']].forEach(([sel,inp])=>{ const S_=el.querySelector(sel), I_=el.querySelector(inp);
      S_.onchange=()=>{ I_.style.display=S_.value==='otro'?'':'none'; if(S_.value==='otro') I_.focus(); else preApply(p,true); };
      I_.onchange=()=>preApply(p,true); });
    p.preOk=false; preFill(p);
    p.m.onBig=()=>{ msg(p,'⚠ Los impactos se ven más grandes que el calibre: revisa calibre y diámetro real del aro 1'); setTimeout(()=>msg(p,''),9000); };
    if(src.kind!=='cam') el.querySelector('.qcamT').textContent='Enfoque y exposición se ajustan en la propia cámara IP.';
    if(src.kind==='g2r'){ p.photoSrc=G2R_PHOTO.get(src.name)||null; }
    const cO=el.querySelector('.cOut'), cA=el.querySelector('.cAsk');
    cO.onchange=()=>{ p.m.S.countOut=cO.checked; p.m.resetRef(); persist(p); };
    cA.onchange=()=>{ p.m.S.askShot=cA.checked; if(!cA.checked) askClose(p); persist(p); };
    const cF=el.querySelector('.cFx'); cF.onchange=()=>{ p.m.S.fxOn=cF.checked; persist(p); };
    // marcar / quitar impactos a mano en la vista ampliada
    p.canvas.addEventListener('click',e=>{ const r=p.canvas.getBoundingClientRect();
      if(p.addNext){ askClose(p); p.m.addShotCss(e.clientX-r.left,e.clientY-r.top); persist(p); return; }   // tras «¿disparo?» → ➕
      if(!el.classList.contains('big')||!e.shiftKey) return;
      p.m.addShotCss(e.clientX-r.left,e.clientY-r.top); persist(p); });
    p.canvas.addEventListener('contextmenu',e=>{ if(!el.classList.contains('big')) return; e.preventDefault(); const r=p.canvas.getBoundingClientRect();
      if(p.m.delNearCss(e.clientX-r.left,e.clientY-r.top)) paint(p); });
    P.push(p); renumber(); $('#grid').appendChild(el); paint(p); layout(); connect(p);
  }
  function removePuesto(p){ if(p.inProg){ p.inProg=false; } recStop(p); closeMedia(p); p.el.remove(); P.splice(P.indexOf(p),1); renumber(); layout(); saveList(); }
  function renumber(){ P.forEach((p,i)=>{ p.n=i+1; p.el.querySelector('.pn').textContent='Puesto '+(i+1); }); }
  function saveList(){ LS('pc_cams', JSON.stringify(P.filter(p=>p.src.kind==='cam').map(p=>p.src))); }
  function msg(p,t){ p.msgTxt=t; const m=p.el.querySelector('.msg'); m.textContent=t; m.classList.toggle('show',!!t); }

  function qSelSet(sel, inp, v){ const o=[...sel.options].find(o=>o.value!=='otro'&&Math.abs(+o.value-v)<0.01);
    sel.value=o?o.value:'otro'; inp.style.display=o?'none':''; inp.value=o?'':(v||''); }
  function preFill(p){ const el=p.el; qSelSet(el.querySelector('.qAro'),el.querySelector('.qAroMm'),p.m.targetD());
    qSelSet(el.querySelector('.qCal'),el.querySelector('.qCalMm'),+p.m.S.caliber||0); }
  function preApply(p,quiet){
    const el=p.el, sa=el.querySelector('.qAro'), sc=el.querySelector('.qCal');
    const aro=sa.value==='otro'?+el.querySelector('.qAroMm').value:+sa.value;
    const cal=sc.value==='otro'?p.m.parseCal(el.querySelector('.qCalMm').value):+sc.value;
    if(!(aro>5)){ msg(p,'⚠ Indica el diámetro del aro 1 en mm'); return false; }
    if(!(cal>0.5)){ msg(p,'⚠ Indica el calibre'); return false; }
    p.m.setAroCal(aro,cal); persist(p); paint(p); if(!quiet) msg(p,''); return true;
  }
  function askPre(p){ p.el.classList.add('needPre'); preFill(p);
    msg(p,'Antes de empezar: confirma el diámetro del aro 1 (mídelo con regla) y el calibre'+(p.el.classList.contains('big')?'.':' (⛶).')); }
  function arm(p,on){
    if(p.inProg){ msg(p,'Este puesto está en la tirada común: se maneja arriba (⏸ / ⏹)'); setTimeout(()=>msg(p,''),3000); return true; }
    if(on && !p.preOk){ askPre(p); return false; }
    const S=p.m.S;
    if(on && S.phase!=='running'){                            // empieza una tirada individual (sin luces)
      if(S.shots.length && !confirm('Empezar una tirada nueva en '+(p.shooter||'Puesto '+p.n)+' borra sus '+S.shots.length+' disparos (guárdalos antes con 💾). ¿Seguir?')) return true;
      p.m.clear(); S.ints=false; S.showRings=false; p.modInfo=null; p.m.sessionStart();
    }
    p.m.armed=on; if(on) recGo(p); else { recPause(p); askClose(p); } paint(p); return true;
  }

  /* =====================================================================
     TIRADA COMÚN (v1.4, de la app v26.2–v27.3): un programa de luces para todos los puestos a la vez,
     como en una galería real. Modalidades con series en verde/rojo, o temporizador libre con luces.
     Cada impacto se juzga por la luz que había CUANDO se disparó (la detección llega algo después).
     ===================================================================== */
  const rpt=(k,o)=>Array.from({length:k},()=>({...o}));
  const MODS={
    'FR3X40':{n:'50m Carabina 3 posiciones (rodilla, tumbado, en pie)', d:'3×40 disparos · 1 h 45 min en total.', ph:[{l:'3×40',ser:[{g:6300,n:120}]}]},
    'FR60PR':{n:'50m Carabina tendido', d:'60 disparos · 1 h en total.', ph:[{l:'60 disparos',ser:[{g:3600,n:60}]}]},
    'RFP':{n:'25m Pistola Tiro Rápido', d:'30+30 disparos. Cada fase: 6 series de 5 disparos (2 en 8 s, 2 en 6 s y 2 en 4 s).',
      ph:[1,2].map(f=>({l:'Fase '+f, ser:[8,8,6,6,4,4].map(g=>({g,n:5}))}))},
    'STP':{n:'25m Pistola Standard (series 150, 20, 10 s)', d:'20+20+20 disparos: 4 series de 5 en 150 s, 4 en 20 s y 4 en 10 s.',
      ph:[{l:'150 s',ser:rpt(4,{g:150,n:5})},{l:'20 s',ser:rpt(4,{g:20,n:5})},{l:'10 s',ser:rpt(4,{g:10,n:5})}]},
    'CTP':{n:'25m Pistola Fuego Central (precisión y tiro rápido)', d:'30+30 disparos. Precisión: 6 series de 5 en 300 s. Tiro rápido: 6 series de 5 disparos, cada uno 3 s en verde y 7 s en rojo.',
      ph:[{l:'Precisión',ser:rpt(6,{g:300,n:5})},{l:'Tiro rápido',ser:rpt(6,{duel:5,g:3,r:7,n:5})}]},
    '9MM':{n:'Pistola 9 mm', d:'30+30 disparos: 6 series de 5 en 150 s y 6 series de 5 en 20 s.',
      ph:[{l:'Precisión',ser:rpt(6,{g:150,n:5})},{l:'Velocidad',ser:rpt(6,{g:20,n:5})}]},
    'SPM':{n:'Pistola 25m (precisión y tiro rápido)', d:'30+30 disparos. Precisión: 6 series de 5 en 300 s. Tiro rápido: 6 series de 5 disparos, cada uno 3 s en verde y 7 s en rojo.',
      ph:[{l:'Precisión',ser:rpt(6,{g:300,n:5})},{l:'Tiro rápido',ser:rpt(6,{duel:5,g:3,r:7,n:5})}]}
  };
  // avancarga: 30 min seguidos, 13 disparos, cuentan los 10 mejores (impacto en la línea por el centro)
  MODS['AVANCARGA']={n:'30 min seguidos · 13 disparos · cuentan los 10 mejores', av:true, d:'30 minutos seguidos, 13 disparos, cuentan los 10 mejores.', ph:[{l:'13 disparos',ser:[{g:1800,n:13}]}]};
  const TP=Object.assign({mod:'', mode:'up', downMin:10, beepSecs:10, altA:7, altB:3, cycles:5, lights:true, maxShots:0, modFirst:7, modPause:60, lead:3, sound:true},
    (()=>{ try{ return JSON.parse(LS('pc_prog')||'{}')||{}; }catch(e){ return {}; } })());
  // pasos del programa: rojo (pausa/aviso) y verde (serie). Cada paso sabe a qué serie pertenece
  function modSteps(key){
    const M=MODS[key], st=[], lbl=[]; let k=0;
    M.ph.forEach(ph=>ph.ser.forEach((sr,si)=>{ k++; const l=ph.l+' · serie '+(si+1)+'/'+ph.ser.length; lbl[k]=l;
      st.push({c:'red', secs:k===1?(+TP.modFirst||0):(+TP.modPause||0), ser:k, l, pre:true});
      if(sr.duel){ for(let j=0;j<sr.duel;j++){ if(j) st.push({c:'red', secs:sr.r, ser:k, l}); st.push({c:'green', secs:sr.g, ser:k, l, n:1}); } }
      else st.push({c:'green', secs:sr.g, ser:k, l, n:sr.n}); }));
    return {st, lbl, nSer:k, tot:M.ph.reduce((a,ph)=>a+ph.ser.reduce((b,sr)=>b+sr.n,0),0)};
  }
  const GP={on:false, phase:'', isMod:false, key:'', ms:null, mi:0, clock:0, lh:[], cyc:0, altOn:'A', beepAcc:0, tick:null, lead:0, info:null};
  const fmtT=s=>{ s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0'); };
  function beepG(freq=880,dur=0.18,vol=0.4){ if(!TP.sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(vol,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur); o.start(); o.stop(actx.currentTime+dur); }catch(e){} }
  // luz del momento: verde = los impactos cuentan, rojo = no (null: sin luces)
  function lightState(){
    if(!GP.on) return null;
    if(GP.isMod){ if(GP.phase==='leadin'||GP.phase==='paused') return 'red'; if(GP.phase!=='running') return null;
      const stp=GP.ms&&GP.ms[GP.mi]; return stp&&stp.c==='green'?'green':'red'; }
    if(!TP.lights) return null;
    if(GP.phase==='leadin'||GP.phase==='paused') return 'red';
    if(GP.phase!=='running') return null;
    if(TP.mode==='alt') return GP.altOn==='B'?'green':'red';
    if(TP.mode==='down') return GP.clock>0?'green':'red';
    return 'green';
  }
  function lightAt(t){ const h=GP.lh||[]; for(let i=h.length-1;i>=0;i--) if(h[i].t<=t) return h[i]; return h[0]||{c:lightState(),i:-1}; }
  let lastLight=null;
  function lightUI(){
    const l=lightState();
    if(l){ const last=GP.lh[GP.lh.length-1], i=GP.isMod?GP.mi:-1; if(!last||last.c!==l||last.i!==i) GP.lh.push({t:performance.now(), c:l, i}); }
    document.body.classList.toggle('lt-green',l==='green'); document.body.classList.toggle('lt-red',l==='red');
    const L=$('#hLt'); L.className='lt '+(l==='green'?'g':l==='red'?'r':'n'); L.textContent=l==='green'?'FUEGO':l==='red'?'ALTO':(GP.phase==='paused'?'PAUSA':'SESIÓN');
    // semáforo grande: al cambiar se ve fuerte y luego se atenúa para no tapar los puestos
    if(l!==lastLight){ lastLight=l; const b=$('#bigLight'); b.className=''; void b.offsetWidth; if(l){ b.textContent=l==='green'?'FUEGO':'ALTO'; b.className=(l==='green'?'g':'r')+' fade'; } }
  }
  function hudUI(){
    const h=$('#hud'); h.classList.toggle('on',GP.on);
    if(!GP.on){ document.body.classList.remove('lt-green','lt-red'); $('#bigLight').className=''; lastLight=null; return; }
    let lbl='Tirada libre', sub='';
    if(GP.phase==='leadin'){ lbl='PREPARADOS'; }
    else if(GP.isMod&&GP.ms&&GP.ms[GP.mi]){ const st=GP.ms[GP.mi]; lbl=GP.key+' · '+(st.c==='red'&&st.pre?'pausa → ':'')+st.l; sub=MODS[GP.key].n; }
    else if(TP.mode==='down') lbl='Cuenta atrás'; else if(TP.mode==='alt') lbl='Alterno · ciclo '+Math.max(1,GP.cyc)+(TP.cycles>0?'/'+TP.cycles:''); else if(TP.mode==='beep') lbl='Intervalo';
    if(GP.phase==='paused') lbl='PAUSA · '+lbl;
    const parts=P.filter(p=>p.inProg).length; sub=(sub?sub+' · ':'')+parts+(parts===1?' puesto':' puestos');
    $('#hLbl').textContent=lbl; $('#hSub').textContent=sub;
    const c=$('#hClk'); c.textContent=GP.phase==='leadin'?String(GP.lead):fmtT(GP.clock);
    c.classList.toggle('alert', GP.phase==='leadin' || ((GP.isMod||TP.mode==='down'||TP.mode==='alt') && GP.clock<=3 && GP.clock>0));
    const st=GP.isMod&&GP.ms?GP.ms[GP.mi]:null; $('#hNext').style.display=(st&&st.c==='red'&&st.pre&&GP.phase==='running')?'':'none';
    $('#hPause').textContent=GP.phase==='paused'?'▶ Reanudar':'⏸ Pausa'; $('#hPause').style.display=GP.phase==='leadin'?'none':'';
    lightUI();
  }
  function clearTickG(){ if(GP.tick){ clearInterval(GP.tick); GP.tick=null; } }
  // un puesto entra en la tirada común (al empezar, o después si se confirma más tarde)
  function joinProg(p){
    const m=p.m, S=m.S; p.inProg=true; p.el.classList.add('inprog'); p.cnt=[];
    if(GP.isMod && MODS[GP.key].av){ const cal=S.caliber; m.setModal('avancarga'); S.caliber=cal; }   // reglas de avancarga, con el calibre del tirador
    else if(GP.isMod && S.modal==='avancarga') m.setModal('issf');
    if(!GP.isMod) S.shotLimit=(+TP.maxShots>0)?+TP.maxShots:(S.modal==='avancarga'?13:0);
    m.clear(); S.ints=GP.isMod; S.showRings=false; p.modInfo=GP.info; m.armed=false; askClose(p);
    m.sessionStart();                                         // foto inicial para el análisis final
    if(GP.phase==='running'){ m.armed=true; recGo(p); }
    paint(p);
  }
  function progParts(){ return P.filter(p=>p.inProg); }
  function startProgram(){
    if(GP.on) return; readProg();
    if(actx&&actx.state==='suspended') actx.resume();
    const ready=P.filter(p=>p.stream&&p.preOk), wait=P.filter(p=>p.stream&&!p.preOk);
    if(!ready.length){ say('Ningún puesto está preparado: en cada puesto ⛶ → confirma aro 1 y calibre → ▶ Empezar sesión',1); wait.forEach(askPre); return; }
    const sh=ready.filter(p=>p.m.S.shots.length);
    if(sh.length && !confirm('Hay '+sh.length+' puesto'+(sh.length>1?'s':'')+' con disparos sin guardar (💾). La tirada nueva los borra. ¿Seguir?')) return;
    ready.forEach(p=>{ if(p.rec) recStop(p); });
    const isMod=!!MODS[TP.mod];
    Object.assign(GP,{on:true, phase:'leadin', isMod, key:isMod?TP.mod:'', ms:null, mi:0, clock:0, lh:[], cyc:0, altOn:'A', beepAcc:0, lead:+TP.lead||0, info:null});
    if(isMod){ const S0=modSteps(TP.mod); GP.ms=S0.st; GP.info={key:TP.mod, name:MODS[TP.mod].n, lbl:S0.lbl, nSer:S0.nSer, tot:S0.tot}; }
    ready.forEach(joinProg); wait.forEach(askPre);
    $('#prog').classList.add('hide'); setBig(null);
    log('Tirada común: '+(isMod?TP.mod+' · '+MODS[TP.mod].n:'temporizador libre')+' · '+ready.length+' puestos');
    clearTickG();
    if(GP.lead>0){ beepG(1046,0.25,0.5); hudUI();
      GP.tick=setInterval(()=>{ GP.lead--; if(GP.lead>0){ if(GP.lead<=5) beepG(660,0.12,0.35); hudUI(); } else { beepG(1046,0.4,0.6); clearTickG(); beginRun(); } },1000); }
    else beginRun();
  }
  function beginRun(){
    GP.phase='running'; GP.beepAcc=0;
    if(GP.isMod){ GP.mi=0; GP.clock=GP.ms[0].secs; }
    else if(TP.mode==='down') GP.clock=Math.round((+TP.downMin||1)*60);
    else if(TP.mode==='alt'){ GP.altOn='A'; GP.clock=+TP.altA||1; GP.cyc=1; }
    else GP.clock=0;
    progParts().forEach(p=>{ p.m.armed=true; recGo(p); paint(p); });
    hudUI(); clearTickG(); GP.tick=setInterval(progTick,1000);
    if(GP.isMod && GP.ms[0].secs<=0) modNext0();
  }
  function modNext0(){ GP.mi--; modNext(); }
  function modNext(){
    GP.mi++;
    if(GP.mi>=GP.ms.length){ beepG(440,0.6,0.6); GP.clock=0; clearTickG(); hudUI(); setTimeout(()=>{ if(GP.on) endProgram(); },1200); return; }
    const st=GP.ms[GP.mi]; GP.clock=st.secs;
    if(st.c==='green') beepG(880,0.4,0.6); else beepG(440,0.45,0.6);          // verde: ¡fuego! · rojo: alto
    hudUI();
    if(st.secs<=0) modNext();
  }
  function progTick(){
    if(GP.phase!=='running') return;
    if(GP.isMod&&GP.ms){ GP.clock--; const st=GP.ms[GP.mi];
      if(GP.clock<=3 && GP.clock>0 && (st.c==='red'||st.secs>=30)) beepG(660,0.12,0.35);
      if(GP.clock<=0){ modNext(); return; } hudUI(); return; }
    if(TP.mode==='down'){ GP.clock--; if(GP.clock<=5&&GP.clock>0) beepG(660,0.12,0.35);
      if(GP.clock<=0){ beepG(440,0.5,0.6); GP.clock=0; clearTickG(); hudUI(); setTimeout(()=>{ if(GP.on) endProgram(); },1200); return; } }
    else if(TP.mode==='alt'){ GP.clock--; if(GP.clock<=3&&GP.clock>0) beepG(660,0.12,0.35);
      if(GP.clock<=0){
        if(GP.altOn==='A'){ GP.altOn='B'; GP.clock=+TP.altB||1; beepG(880,0.35,0.55); }
        else if(TP.cycles>0 && GP.cyc>=TP.cycles){ beepG(440,0.5,0.6); GP.clock=0; GP.altOn='A'; clearTickG(); hudUI(); setTimeout(()=>{ if(GP.on) endProgram(); },1200); return; }
        else { GP.cyc++; GP.altOn='A'; GP.clock=+TP.altA||1; beepG(520,0.35,0.55); } } }
    else { GP.clock++; if(TP.mode==='beep'){ GP.beepAcc++; if(GP.beepAcc>=(+TP.beepSecs||10)){ GP.beepAcc=0; beepG(880,0.15,0.4); } } }
    hudUI();
  }
  function pauseProgram(){
    if(GP.phase==='running'){ GP.phase='paused'; progParts().forEach(p=>{ p.m.armed=false; recPause(p); askClose(p); paint(p); }); }
    else if(GP.phase==='paused'){ GP.phase='running'; progParts().forEach(p=>{ p.m.armed=true; recGo(p); paint(p); }); if(!GP.tick) GP.tick=setInterval(progTick,1000); }
    hudUI();
  }
  // fin: análisis final de cada puesto (foto) y después se guarda la grabación con el resultado
  function endProgram(){
    if(!GP.on) return; clearTickG(); const parts=progParts();
    GP.on=false; GP.phase='done'; beepG(880,0.15); setTimeout(()=>beepG(880,0.15),180); setTimeout(()=>beepG(1200,0.3),380);
    parts.forEach(p=>leaveProg(p)); hudUI(); log('Tirada común terminada');
    say('Tirada terminada: revisa cada puesto (⛶) y guárdala con 💾');
  }
  function leaveProg(p){
    p.inProg=false; p.el.classList.remove('inprog'); p.m.armed=false; askClose(p); p.preOk=false;
    p.m.sessionEnd().then(()=>{ recStop(p); paint(p); persist(p); }); paint(p);
  }
  // panel del programa
  function progUI(){
    const sel=$('#pMod'); if(!sel.options.length){

  // diana dibujada con los impactos (para el informe)
  function targetPNG(p,px){

    g.fillStyle='#fff'; g.fillRect(0,0,px,px); const rr=m.ringRadii(), n=rr.length-1, br=m.blackRadius();
    g.fillStyle='#f4f1e8'; g.beginPath(); g.arc(cx,cy,R,0,7); g.fill();
    g.fillStyle='#111'; g.beginPath(); g.arc(cx,cy,br*R,0,7); g.fill();

    S.shots.forEach((s,i)=>{ const x=cx+s.rx*R, y=cy+s.ry*R; g.beginPath(); g.arc(x,y,dot,0,7);

  async function saveSession(p){

  /* ---------- GRABACIÓN de cada tirada (v26.0): se guarda en el disco del PC ----------

  /* ---------- enfoque y exposición (solo webcams; las cámaras IP se ajustan en la propia cámara) ---------- */
  async function focusTrack(t, cmd, poi){
    if(!t) return {ok:false, why:'sin cámara'};
    let caps={}; try{ caps=t.getCapabilities?t.getCapabilities():{}; }catch(e){}
    const modes=caps.focusMode||[];
    if(!modes.length) return {ok:false, why:'esta cámara no permite controlar el enfoque'};
    const P_ = poi ? {pointsOfInterest:[{x:Math.min(1,Math.max(0,poi.x)), y:Math.min(1,Math.max(0,poi.y))}]} : {};
    let poiOk=false;
    const ap=async c=>{ try{ await t.applyConstraints({advanced:[c]}); return true; }catch(e){ return false; } };
    if(poi){ poiOk=await ap(P_);
      try{ const st=t.getSettings(); poiOk = poiOk && !!(st.pointsOfInterest && st.pointsOfInterest.length); }catch(e){ poiOk=false; } }
    if(cmd==='af'){ if(!modes.includes('continuous')) return {ok:false, why:'sin autoenfoque continuo'}; await ap(Object.assign({focusMode:'continuous'},P_)); return {ok:true, af:true, poi:poiOk}; }
    if(cmd==='manual'){ if(!modes.includes('manual')) return {ok:false, why:'no admite enfoque fijo'}; await ap({focusMode:'manual'}); return {ok:true, af:false}; }
    const prev=(t.getSettings&&t.getSettings().focusMode)||'continuous';
    if(modes.includes('single-shot')) await ap(Object.assign({focusMode:'single-shot'},P_));
    else if(modes.includes('continuous')){ if(modes.includes('manual')) await ap({focusMode:'manual'}); await ap(Object.assign({focusMode:'continuous'},P_)); }
    if(prev==='manual') setTimeout(()=>ap({focusMode:'manual'}),1500);
    else if(prev==='continuous' && modes.includes('continuous')) setTimeout(()=>ap(Object.assign({focusMode:'continuous'},P_)),1500);
    return {ok:true, poi:poiOk, af:prev!=='manual'};
  }
  async function expoTrack(t, dir){
    if(!t) return {ok:false, why:'sin cámara'};
    let caps={}, st={}; try{ caps=t.getCapabilities?t.getCapabilities():{}; st=t.getSettings?t.getSettings():{}; }catch(e){}
    const ec=caps.exposureCompensation;
    if(!ec || !(ec.max>ec.min)) return {ok:false, why:'esta cámara no permite cambiar la exposición'};
    const stp=Math.max(ec.step||0.1,(ec.max-ec.min)/12), cur=typeof st.exposureCompensation==='number'?st.exposureCompensation:0;
    const v=Math.max(ec.min,Math.min(ec.max,Math.round((cur+dir*stp)/(ec.step||0.1))*(ec.step||0.1)));
    try{ await t.applyConstraints({advanced:[{exposureMode:'continuous', exposureCompensation:v}]}); }catch(e){ return {ok:false, why:'no aceptó el cambio'}; }
    return {ok:true, val:v, min:ec.min, max:ec.max};
  }
  async function camCmd(p,a){
    const T=p.el.querySelector('.qcamT');
    if(p.src.kind!=='cam'){ T.textContent='Enfoque y exposición se ajustan en la propia cámara IP.'; return; }
    const t=p.stream&&p.stream.getVideoTracks()[0];
    if(a==='expM'||a==='expP'){ const r=await expoTrack(t,a==='expP'?1:-1);
      T.textContent=r.ok?'Exposición '+(r.val>0?'+':'')+(+r.val).toFixed(1)+' · referencia rehecha. Con luz trasera: que el papel no se vea quemado':'⚠ '+r.why;
      if(r.ok) p.m.resetRef(); return; }
    const center=a==='focusC', r=await focusTrack(t, center?'once':a==='af'?'af':'manual', center?p.m.targetCenterVid():null);
    T.textContent=!r.ok?'⚠ Enfoque: '+r.why : center?(r.poi?'⊕ Enfocado al centro de la diana':'⊕ Enfocado (esta cámara no deja elegir el punto: enfoca la zona central)')
      : r.af===false?'Enfoque fijo (no cambiará al disparar)':'Autoenfoque continuo';
  }

  function onShot(p,sh){
    if(p.rec && !p.rec.paused && sh.imp!=null) sh.vt=Math.max(0,(sh.imp-p.rec.t0-p.rec.pausedMs)/1000);
    askClose(p);
    // tirada común con luces: vale la luz del momento del disparo; en modalidad, los disparos de más de cada verde tampoco cuentan
    if(p.inProg && lightState() && !(sh.manual&&p.m.S.phase==='review')){
      const L=lightAt(sh.impL!=null?sh.impL:performance.now()); sh.late=L.c==='red';
      if(GP.isMod&&GP.ms&&L.i>=0&&GP.ms[L.i]){ const st=GP.ms[L.i]; sh.ser=(st.c==='red'&&st.pre&&st.ser>1)?st.ser-1:st.ser;
        if(!sh.late&&st.n){ p.cnt[L.i]=(p.cnt[L.i]||0)+1; if(p.cnt[L.i]>st.n){ sh.over=true; sh.late=true; } } } }
    const I=!!p.m.S.ints, f=p.el.querySelector('.flash'); f.textContent=sh.late?'✕':sh.ring>0?(I?String(sh.ring):f1(sh.dec)):'0'; f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
    log(p.label+(p.shooter?' ('+p.shooter+')':'')+': disparo '+p.m.S.shots.length+' → '+(I?sh.ring:f1(sh.dec))+(sh.late?(sh.over?' (de más, no cuenta)':' (luz roja, no cuenta)'):''));
    paint(p); persist(p);
  }
  function paint(p){
    const T=p.m.totals(), S=p.m.S, el=p.el;
    const I=!!S.ints;                                           // modalidades: enteros, sin décimas
    el.querySelector('.last').textContent=T.last?(T.last.late?'✕':I?String(T.last.ring):f1(T.last.dec)):'—';
    el.querySelector('.tot').textContent=I?String(T.sumInt):f1(T.sum);
    el.querySelector('.ntir').textContent=(T.counted<T.n?T.counted+'/':'')+T.n+(T.n===1?' tiro':' tiros')+(S.shotLimit?' de '+S.shotLimit:'')+(I?'':' · '+T.sumInt+' pts');
    el.querySelector('[data-a="rings"]').classList.toggle('off',S.showRings===false);
    el.querySelector('.cFx').checked=S.fxOn!==false; el.querySelector('.fxMsg').textContent=p.m.fx.msg||'';
    el.querySelector('.redl').style.display=p.lastSave?'':'none';
    el.classList.toggle('armed',p.m.armed);
    el.querySelector('.badge').textContent=(p.inProg?'🚦 ':'')+(p.m.armed?'● DETECTANDO':S.phase==='review'?'REVISIÓN':'PARADO')+(p.rec?(p.rec.paused?' · REC en pausa':' · 🔴 REC'):'');
    el.querySelector('.cOut').checked=S.countOut!==false; el.querySelector('.cAsk').checked=S.askShot!==false;
    const ba=el.querySelector('[data-a="arm"]'); ba.textContent=p.m.armed?'⏸':'▶'; ba.classList.toggle('on',p.m.armed);
    el.querySelector('[data-a="type"]').textContent=S.detectType==='laser'?'🔴':'◎';
    el.querySelector('[data-a="type"]').title=S.detectType==='laser'?'Detectando láser (cambiar a cartón)':'Detectando cartón (cambiar a láser)';
    el.querySelector('.selTarget').value=TARGETS[S.target]?S.target:'custom';
    el.querySelector('.selModal').value=MODALS[S.modal]?S.modal:'issf';
    el.querySelector('.selSens').value=S.holeSens; el.querySelector('.vSens').textContent=S.holeSens;
    el.querySelector('.aro').innerHTML='aro 1 '+f1(p.m.targetD())+' mm<br>cal. '+f1(+S.caliber||0)+' mm';
    if(el.classList.contains('big')){
      el.querySelector('.shots').innerHTML=S.shots.map((s,i)=>'<div class="'+(s.late?'late':s.drop?'drop':'')+(s.rec?' rec':'')+(s.dud?' dud':'')+(i===S.shots.length-1?' lastS':'')+'" title="'+
        (s.ser?'serie '+s.ser+' · ':'')+(s.over?'de más · ':s.late?'luz roja · ':'')+(s.manual?'marcado a mano':'')+(s.rec?'recuperado por la foto':'')+(s.dud?'dudoso':'')+'">'+(s.ring===0&&s.dRel>1?'0':I?s.ring:f1(s.dec))+(s.manual?'*':'')+'</div>').join('');
      el.querySelector('.serTot').textContent=p.modInfo?serieGroups(p).map(G=>(G.t.split(' · ')[0])+': '+G.sh.filter(s=>!s.drop).reduce((a,s)=>a+(I?s.ring:s.dec),0)).join(' · '):''; }
  }
  function paintStatus(p){
    const s=p.m.status(), c=p.el.querySelector('.st');
    if(c.textContent!==s.txt) c.textContent=s.txt; c.className='chip st '+s.st;
    if(p.el.classList.contains('big')){ const h=p.el.querySelector('.hinfo'), t=p.m.S.detectType==='holes'?p.m.holeInfo():p.m.liveRed; if(h.textContent!==t) h.textContent=t; }

  $('#grid').addEventListener('click',e=>{
    const b=e.target.closest('[data-a]'); if(!b) return;
    const p=P.find(x=>x.id===+b.closest('.tile').dataset.id); if(!p) return;
    const a=b.dataset.a, m=p.m;
    if(a==='arm'){ if(!arm(p,!m.armed) && !p.el.classList.contains('big')) setBig(p); }
    else if(a==='preGo'){ if(preApply(p)){ p.preOk=true; p.el.classList.remove('needPre'); if(GP.on){ msg(p,'🚦 Entra en la tirada común'); setTimeout(()=>msg(p,''),2500); joinProg(p); hudUI(); } else arm(p,true); } }
    else if(['focusC','af','mf','expM','expP'].includes(a)){ camCmd(p,a); }
    else if(a==='askAdd'){ p.addNext=true; clearTimeout(p.askT); p.el.classList.add('adding'); p.el.querySelector('.askTxt').innerHTML='<b>Haz clic en la diana donde fue el disparo</b>';
      p.askT=setTimeout(()=>askClose(p),25000); return; }
    else if(a==='askZero'){ askClose(p); m.addZero(); persist(p); }
    else if(a==='askNo'){ askClose(p); }
    else if(a==='fin'){ if(p.inProg){ if(!confirm('¿Sacar a '+(p.shooter||'Puesto '+p.n)+' de la tirada común y terminar la suya?')) return; leaveProg(p); }
      else { m.armed=false; askClose(p); p.preOk=false; if(m.S.phase==='running'||p.rec) m.sessionEnd().then(()=>{ recStop(p); paint(p); persist(p); }); } }
    else if(a==='rings'){ m.S.showRings=m.S.showRings===false; persist(p); }
    else if(a==='save'){ saveSession(p); return; }
    else if(a==='ok'){ persist(p); setBig(null); return; }
    else if(a==='fxRedo'){ if(!m.fx.A){ msg(p,'No hay foto inicial: el análisis final se activa al empezar una tirada en cartón'); setTimeout(()=>msg(p,''),4000); return; } m.fxRedo().then(()=>paint(p)); }
    else if(a==='fxUndo'){ m.fxUndo(); persist(p); }
    else if(a==='fxSug'){ m.fxAddSug(); persist(p); }
    else if(a==='redl'){ if(p.lastSave){ dl(p.lastSave.rep,p.lastSave.nRep); dl(p.lastSave.json,p.lastSave.nJson); } return; }
    else if(a==='repLast'){ if(p.lastRep) repView(p.lastRep); else { repList(); } return; }
    else if(a==='cal'){ msg(p,'Analizando la diana…'); setTimeout(()=>{ const r=m.autoCalib();
      msg(p, r.ok ? '🎯 '+r.name+(r.hint?' · '+r.hint:'')+' · comprueba los aros' : '🎯 '+r.msg);
      if(r.ok && p.src.kind==='cam') setTimeout(()=>camCmd(p,'focusC'),300);
      setTimeout(()=>{ if(p.msgTxt&&p.msgTxt.startsWith('🎯')) msg(p,''); },6000); persist(p); paint(p); },30); }
    else if(a==='type'){ m.setDetect(m.S.detectType==='laser'?'holes':'laser'); persist(p); }
    else if(a==='undo'){ if(m.undo()) persist(p); }
    else if(a==='new'){ if(!m.S.shots.length || confirm('¿Borrar los '+m.S.shots.length+' disparos de '+(p.shooter||'Puesto '+p.n)+'?')){ recStop(p); askClose(p); m.clear(); m.armed=false; p.preOk=false; persist(p); } }
    else if(a==='big'){ setBig(p.el.classList.contains('big')?null:p); }
    else if(a==='ref'){ m.resetRef(); msg(p,'Referencia rehecha'); setTimeout(()=>msg(p,''),2500); }
    else if(a==='remove'){ if(confirm('¿Quitar '+p.label+' de la galería?')){ setBig(null); removePuesto(p); } return; }
    paint(p);
  });
  function setBig(p){ P.forEach(x=>x.el.classList.toggle('big',x===p)); if(p) paint(p); }
  addEventListener('keydown',e=>{ if(e.key==='Escape') setBig(null); });

  $('#allArm').onclick=()=>{ let n=0; P.forEach(p=>{ if(!arm(p,true)) n++; });
    if(n) say(n===1?'1 puesto espera que confirmes aro 1 y calibre (⛶)':n+' puestos esperan que confirmes aro 1 y calibre (⛶)'); };
  $('#allStop').onclick=()=>{ P.forEach(p=>{ if(!p.inProg) arm(p,false); }); };
  $('#allNew').onclick=()=>{ const n=P.reduce((a,p)=>a+p.m.S.shots.length,0);
    if(GP.on){ say('Hay una tirada común en marcha: termínala antes (⏹ arriba)',1); return; }
    if(n && !confirm('¿Borrar los disparos de todos los puestos ('+n+' en total)?')) return; P.forEach(p=>{ recStop(p); askClose(p); p.m.clear(); p.m.armed=false; p.preOk=false; p.modInfo=null; persist(p); paint(p); }); };
  $('#cfgOk').onclick=()=>$('#cfg').classList.add('hide');
  $('#cfgBtn').onclick=()=>$('#cfg').classList.toggle('hide');

  function layout(){
    const n=P.length, c=+$('#colsSel').value || (n<=1?1:n<=4?2:n<=9?3:4);
    document.documentElement.style.setProperty('--cols',c); document.documentElement.style.setProperty('--rows',Math.max(1,Math.ceil(n/c)));
    $('#empty').style.display=n?'none':'block';
    say(n?(n===1?'1 puesto':n+' puestos'):'Sin cámaras');
  }
  $('#colsSel').onchange=()=>{ LS('pc_cols',$('#colsSel').value); layout(); };
  addEventListener('resize',layout);

  /* ---------- cámaras de go2rtc ---------- */
  const G2R_PHOTO=new Map();          // cámara → su entrada de foto en go2rtc
  async function readG2r(){
    const base=$('#g2r').value.replace(/\/$/,''); LS('pc_g2r',$('#g2r').value);
    if(location.protocol==='https:' && /^http:/.test(base) && !/^http:\/\/(localhost|127\.)/.test(base)){
      say('Desde esta página (https) solo se llega a go2rtc en este mismo PC (localhost). Si go2rtc está en otro equipo, abre la página desde él.',1); return; }
    say('Leyendo cámaras…');
    try{
      const r=await fetch(base+'/api/streams'); if(!r.ok) throw new Error('go2rtc respondió '+r.status);
      const all=Object.keys(await r.json());
      // «Puesto 1 foto» no es un puesto: es el enlace de foto de la cámara de «Puesto 1»
      const isPh=n=>/\s+foto$/i.test(n), names=all.filter(n=>!isPh(n));
      G2R_PHOTO.clear(); all.filter(isPh).forEach(n=>{ const cam=n.replace(/\s+foto$/i,''); if(all.includes(cam)) G2R_PHOTO.set(cam,n); });
      if(!names.length){ say('go2rtc no tiene cámaras configuradas',1); return; }
      names.forEach(n=>addPuesto({kind:'g2r', name:n}, n));
      P.forEach(p=>{ if(p.src.kind==='g2r'){ const ph=G2R_PHOTO.get(p.src.name)||null; if(ph!==p.photoSrc){ p.photoSrc=ph; p.photoOk=false; } p.noSnap=false; photoInfo(p); } });
      LS('pc_auto','1'); layout(); log('go2rtc: '+names.length+' cámaras'+(G2R_PHOTO.size?' · '+G2R_PHOTO.size+' con foto':''));
    }catch(e){ say('No se puede leer go2rtc en '+base+' ('+e.message+'). ¿Está abierto go2rtc?',1); }
  }
  $('#connBtn').onclick=readG2r;

  /* ---------- webcams (para probar sin cámaras IP) ---------- */
  async function listCams(){
    try{ const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
      $('#camSel').innerHTML='<option value="">— elegir —</option>'+ds.map((d,i)=>'<option value="'+esc(d.deviceId)+'">'+esc(d.label||'Cámara '+(i+1))+'</option>').join('');
      return ds; }catch(e){ return []; }
  }
  $('#camSel').addEventListener('focus',async()=>{ const ds=await listCams();
    if(ds.length && !ds[0].label){ try{ const s=await navigator.mediaDevices.getUserMedia({video:true}); s.getTracks().forEach(t=>t.stop()); await listCams(); }catch(e){} } });
  $('#camAdd').onclick=async()=>{
    let id=$('#camSel').value;
    if(!id){ try{ const s=await navigator.mediaDevices.getUserMedia({video:true}); id=s.getVideoTracks()[0].getSettings().deviceId||''; s.getTracks().forEach(t=>t.stop()); await listCams(); }
      catch(e){ say('No se puede abrir la webcam: '+e.message,1); return; } }
    const opt=[...$('#camSel').options].find(o=>o.value===id), label=opt&&opt.value?opt.textContent:'Webcam';
    addPuesto({kind:'cam', deviceId:id, label}, label); saveList();
  };

  /* ---------- bucle: cada puesto analiza su imagen (~30 por segundo) ---------- */
  let lastF=0, lastS=0;
  function loop(t){
    requestAnimationFrame(loop);
    if(t-lastF<30) return; lastF=t;
    for(const p of P){ if(p.stream && p.video.readyState>=2){ try{ p.m.step(); }catch(e){ if(!p.errLogged){ p.errLogged=1; log(p.label+': '+e.message); } } } }
    if(t-lastS>300){ lastS=t; P.forEach(paintStatus); }
  }
  requestAnimationFrame(loop);

  // la pantalla del PC no se apaga mientras la galería está abierta
  async function wake(){ try{ if(navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){} }
  wake(); document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') wake(); });
  addEventListener('beforeunload',e=>{ P.forEach(persist); if(P.some(p=>p.rec)){ P.forEach(recStop); e.preventDefault(); e.returnValue=''; } });

  // arranque: webcams guardadas y, si ya se usó, las cámaras de go2rtc
  try{ (JSON.parse(LS('pc_cams')||'[]')||[]).forEach(s=>addPuesto(s, s.label||'Webcam')); }catch(e){}
  const autoG=LS('pc_auto')==='1' || servedByG2r;     // abierta desde go2rtc: lee las cámaras sola
  if(autoG) readG2r();
  if(P.length || autoG) $('#cfg').classList.add('hide');
  layout();
})();
</script>
</body>
</html>
