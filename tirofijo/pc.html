<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tirofijo PC · Galería</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22%23f85149%22/%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2224%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%229%22 fill=%22%23f85149%22/%3E%3C/svg%3E">
<style>
  :root{ --bg:#0d1117; --panel:#161b22; --line:#30363d; --txt:#e6edf3; --muted:#8b949e; --accent:#f85149; --ok:#3fb950; --gold:#d29922; --blue:#58a6ff; --cols:2; --rows:1; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--txt); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; display:flex; flex-direction:column;}
  header{display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel);}
  h1{margin:0; font-size:20px; letter-spacing:.4px; white-space:nowrap;} h1 b{color:var(--accent);}
  .ver{color:var(--muted); font-size:12px;}
  .sp{flex:1}
  input,select{background:#0d1117; border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:7px 9px; font-size:14px;}
  button{background:#21262d; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:7px 12px; font-size:14px; font-weight:700; cursor:pointer; white-space:nowrap;}
  button:hover{border-color:#8b949e;}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.go{background:#238636; border-color:#2ea043; color:#fff;}
  .cfg{display:flex; flex-wrap:wrap; gap:8px 10px; align-items:end; padding:10px 16px; border-bottom:1px solid var(--line);}
  .cfg label{display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}
  .cfg.hide{display:none;}
  #state{color:var(--muted); font-size:13px; align-self:center;}
  #state.err{color:var(--accent);}
  main{flex:1; min-height:0; padding:12px; overflow:auto;}
  .grid{display:grid; grid-template-columns:repeat(var(--cols),minmax(0,1fr)); grid-template-rows:repeat(var(--rows),minmax(230px,1fr)); gap:12px; height:100%;}
  .grid:empty{display:none;}
  .empty{color:var(--muted); text-align:center; padding:60px 20px; font-size:16px;}
  .tile{background:var(--panel); border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; min-width:0; overflow:hidden;}
  .tile.armed{border-color:var(--ok); box-shadow:0 0 0 1px var(--ok) inset;}
  .th{display:flex; align-items:center; gap:8px; padding:7px 10px;}
  .pn{font-size:16px; white-space:nowrap;}
  .src{color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:120px;}
  .shooter{flex:1; min-width:60px; padding:4px 8px; font-size:14px; font-weight:600;}
  .chip{font-size:11px; font-weight:800; padding:3px 9px; border-radius:20px; background:var(--line); white-space:nowrap;}
  .chip.ok{background:#1f6f35; color:#d7ffe0;} .chip.cand{background:var(--gold); color:#1a1200;} .chip.mov{background:#6e4b00; color:#ffe7a8;}
  .chip.off{background:var(--accent); color:#fff;} .chip.wait{background:#30363d; color:#c9d1d9;}
  .stage{position:relative; flex:1; min-height:120px; background:#000;}
  .stage video,.stage canvas{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;}
  .stage canvas{pointer-events:none;}
  .flash{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(.6); font-size:min(16vh,120px); font-weight:900; color:#ffd60a;
    text-shadow:0 0 12px #000,0 0 3px #000; opacity:0; pointer-events:none;}
  .flash.show{animation:fl 1.4s ease-out;}
  @keyframes fl{0%{opacity:1; transform:translate(-50%,-50%) scale(1.1);} 60%{opacity:1;} 100%{opacity:0; transform:translate(-50%,-50%) scale(.9);}}
  .badge{position:absolute; left:8px; top:8px; font-size:11px; font-weight:800; padding:3px 8px; border-radius:6px; background:rgba(0,0,0,.6); color:var(--muted); pointer-events:none;}
  .tile.armed .badge{color:#7ee787;}
  .msg{position:absolute; left:8px; right:8px; bottom:8px; font-size:12px; padding:4px 8px; border-radius:6px; background:rgba(0,0,0,.7); display:none; pointer-events:none;}
  .msg.show{display:block;}
  .tf{display:flex; align-items:center; gap:14px; padding:7px 10px; flex-wrap:wrap;}
  .sc{display:flex; flex-direction:column; line-height:1.1;}
  .sc small{color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.6px;}
  .sc b{font-size:24px; font-variant-numeric:tabular-nums;}
  .sc .last{color:#ffd60a;}
  .sc span{color:var(--muted); font-size:11px;}
  .btns{display:flex; gap:5px; margin-left:auto; flex-wrap:wrap;}
  .btns button{padding:6px 9px; font-size:15px;}
  .btns button.on{background:#238636; border-color:#2ea043;}
  .more{display:none;}
  /* vista ampliada de un puesto */
  .tile.big{position:fixed; inset:0; z-index:50; border-radius:0; display:grid; grid-template-columns:1fr 300px; grid-template-rows:auto 1fr auto;}
  .tile.big .th{grid-column:1/3;}
  .tile.big .stage{min-height:0;}
  .tile.big .stage canvas{pointer-events:auto; cursor:crosshair;}
  .tile.big .tf{grid-column:1/2;}
  .tile.big .more{display:flex; flex-direction:column; gap:10px; grid-column:2; grid-row:2/4; padding:10px 12px; border-left:1px solid var(--line); overflow:auto;}
  .tile.big .sc b{font-size:34px;}
  .more label{display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}
  .shots{display:grid; grid-template-columns:repeat(5,1fr); gap:4px; font-variant-numeric:tabular-nums;}
  .shots div{background:#0d1117; border:1px solid var(--line); border-radius:6px; text-align:center; padding:3px 0; font-weight:700;}
  .shots div.drop{color:var(--muted); text-decoration:line-through;}
  .shots div.lastS{border-color:#ffd60a; color:#ffd60a;}
  .hint{color:var(--muted); font-size:12px;}
  .pre{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:8px; border:1px solid var(--line); border-radius:10px;}
  .pre label{font-size:10px;} .pre select,.pre input{width:100%; font-size:13px; padding:6px;}
  .pre .preGo{grid-column:1/3; display:none;}
  .tile.needPre .pre{outline:2px solid var(--gold); outline-offset:2px;} .tile.needPre .pre .preGo{display:block;}
  .qrow{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px;} .qrow button{padding:7px 4px; font-size:12px; white-space:normal;}
  .hinfo{color:var(--muted); font:11px ui-monospace,monospace; min-height:2.6em;}
  .aro{color:var(--muted); font-size:11px;}
  .ask{position:absolute; left:8px; right:8px; top:34px; z-index:5; display:none; background:rgba(13,17,23,.92); border:1px solid var(--gold); border-radius:10px; padding:7px 9px; font-size:13px;}
  .ask.open{display:block;} .ask .row{display:flex; gap:6px; margin-top:6px;} .ask button{flex:1; padding:6px 4px; font-size:13px;}
  .ask button.y{background:var(--gold); border-color:var(--gold); color:#1a1200;}
  .tile.adding .stage canvas{pointer-events:auto; cursor:crosshair;}
  .tile.asking{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset;}
  .chk{display:flex; gap:8px; align-items:flex-start; font-size:12px; color:var(--txt); cursor:pointer;} .chk input{margin-top:2px;}
  .cfg .chk{align-self:center;}
  #dirName{color:var(--muted); font-size:12px; align-self:center; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .modal{position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; padding:20px;}
  .modal.open{display:flex;}
  .modal .box{background:var(--panel); border:1px solid var(--line); border-radius:14px; width:min(1100px,100%); max-height:100%; overflow:auto; padding:14px 16px; position:relative;}
  .modal .x{position:absolute; right:10px; top:10px;}
  .modal h3{margin:2px 0 10px;}
  .repItem{display:flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-top:8px;}
  .repItem div{flex:1;} .repItem .hint{display:block;}
  .vwrap{position:relative; background:#000; border-radius:12px; overflow:hidden; aspect-ratio:16/9; max-height:62vh; margin:0 auto;}
  .vwrap video{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; transform-origin:50% 50%; transition:transform .25s;}
  .vwrap .mk{position:absolute; width:34px; height:34px; margin:-17px 0 0 -17px; border:2px solid var(--gold); border-radius:50%; pointer-events:none; display:none; box-shadow:0 0 0 2px rgba(0,0,0,.5);}
  .vwrap .lbl{position:absolute; left:8px; top:8px; background:rgba(0,0,0,.6); color:#fff; font:700 13px system-ui; padding:4px 8px; border-radius:8px;}
  .rchips{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0;}
  .rchips button{min-width:58px; padding:6px 9px; font-size:13px;} .rchips button.on,.ctl button.on{background:var(--gold); border-color:var(--gold); color:#1a1200;}
  .ctl{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:6px;} .ctl button{padding:8px 4px; font-size:13px;}
  .log{color:var(--muted); font:11px ui-monospace,monospace; max-height:90px; overflow:auto; white-space:pre-wrap; padding:4px 16px; border-top:1px solid var(--line);}
</style>
</head>
<body>
<header>
  <h1><b>◎</b> Tirofijo PC</h1>
  <span class="ver" id="appVer"></span>
  <span class="sp"></span>
  <button class="go" id="allArm">▶ Detectar en todos</button>
  <button id="allStop">⏸ Parar todos</button>
  <button id="allNew">⟲ Nueva tirada en todos</button>
  <button id="repBtn" title="Repeticiones de las tiradas grabadas">🎬</button>
  <button id="cfgBtn" title="Cámaras, conexión y grabación">⚙</button>
</header>

<div class="cfg" id="cfg">
  <label>Dirección de go2rtc<input id="g2r" size="26"></label>
  <button class="primary" id="connBtn">▶ Leer cámaras de go2rtc</button>
  <label>Cámara USB / webcam<select id="camSel"><option value="">— elegir —</option></select></label>
  <button id="camAdd">＋ Añadir webcam</button>
  <label>Columnas<select id="colsSel"><option value="0">Auto</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
  <label class="chk"><input type="checkbox" id="repOn"> 🎬 Grabar cada tirada</label>
  <button id="dirBtn" title="Carpeta del PC donde se guardan los vídeos">📁 Carpeta de grabaciones</button><span id="dirName"></span>
  <span id="state">Sin cámaras</span>
</div>

<main><div class="grid" id="grid"></div><div class="empty" id="empty">Pulsa <b>Leer cámaras de go2rtc</b> (una cámara IP por puesto) o añade una webcam para probar.</div></main>
<div class="log" id="log"></div>

<div class="modal" id="repModal"><div class="box"><button class="x" id="repClose">✕</button><div id="repBody"></div></div></div>

<template id="tileTpl">
  <div class="tile">
    <div class="th"><b class="pn"></b><span class="src"></span><input class="shooter" placeholder="Tirador"><span class="chip st wait">…</span></div>
    <div class="stage"><video muted playsinline autoplay></video><canvas></canvas><div class="badge">PARADO</div><div class="flash"></div>
      <div class="ask"><span class="askTxt"></span><div class="row"><button class="y" data-a="askAdd">➕ Marcar dónde fue</button><button data-a="askZero">0 · fuera</button><button data-a="askNo">✕ No</button></div></div><div class="msg"></div></div>
    <div class="tf">
      <div class="sc"><small>Último</small><b class="last">—</b></div>
      <div class="sc"><small>Total</small><b class="tot">0</b><span class="ntir">0 tiros</span></div>
      <div class="sc"><span class="aro"></span></div>
      <div class="btns">
        <button data-a="arm" title="Empezar / parar la detección">▶</button>
        <button data-a="cal" title="Autocalibrar la diana">🎯</button>
        <button data-a="type" title="Láser o cartón">🔴</button>
        <button data-a="undo" title="Quitar el último disparo">↩</button>
        <button data-a="fin" title="Terminar la tirada (para y guarda la grabación)">⏹</button>
        <button data-a="new" title="Nueva tirada (borra los disparos)">⟲</button>
        <button data-a="big" title="Ampliar / volver a la cuadrícula">⛶</button>
      </div>
    </div>
    <div class="more">
      <div class="pre">
        <label>Diámetro aro 1<select class="qAro"><option value="155.5">Pistola aire 10 m · 155,5</option><option value="45.5">Carabina aire 10 m · 45,5</option>
          <option value="154.4">Carabina 50 m · 154,4</option><option value="500">Pistola 25/50 m · 500</option>
          <option value="132">Tarjeta 14×14 cm · ≈132</option><option value="otro">Otra medida (mm)…</option></select>
          <input type="number" class="qAroMm" placeholder="mm del aro 1" style="display:none; margin-top:4px"></label>
        <label>Calibre<select class="qCal"><option value="4.5">4,5 · .177 aire</option><option value="5.5">5,5 · .22 aire</option>
          <option value="5.6">5,6 · .22 LR</option><option value="7.62">7,62 · .30 / .308</option><option value="9">9 mm</option>
          <option value="9.65">9,65 · .38 / .357</option><option value="10.2">10,2 · .40</option>
          <option value="11.43">11,43 · .45 / avancarga</option><option value="otro">Otro (mm o pulg.)…</option></select>
          <input type="number" class="qCalMm" placeholder="mm o pulgadas" style="display:none; margin-top:4px"></label>
        <button class="go preGo" data-a="preGo">▶ Empezar sesión</button>
      </div>
      <label>Diana<select class="selTarget"></select></label>
      <label>Modalidad<select class="selModal"></select></label>
      <label>Sensibilidad (cartón): <b class="vSens"></b><input class="selSens" type="range" min="1" max="8" step="1"></label>
      <div class="qcam"><small class="hint">Cámara</small>
        <div class="qrow"><button data-a="focusC" title="Enfocar al centro de la diana">⊕ Centro</button><button data-a="af" title="Autoenfoque continuo">Autoenfoque</button><button data-a="mf" title="Enfoque fijo">Enf. fijo</button>
          <button data-a="expM">Expo −</button><button data-a="expP">Expo +</button><button data-a="ref" title="Rehacer la referencia">↻ Referencia</button></div>
        <div class="hint qcamT"></div></div>
      <label class="chk"><input type="checkbox" class="cOut"> Disparos fuera del aro 1 cuentan como 0</label>
      <label class="chk"><input type="checkbox" class="cAsk"> Preguntar «¿disparo?» si la tarjeta se mueve sin agujero nuevo</label>
      <div class="hinfo"></div>
      <button data-a="repLast">🎬 Ver la última tirada de este puesto</button>
      <div><small class="hint">Disparos</small><div class="shots"></div></div>
      <div class="hint">Mayús + clic en la imagen: añadir un impacto a mano · clic derecho: quitar el impacto más cercano · Esc: volver.</div>
      <button data-a="remove">✕ Quitar este puesto</button>
    </div>
  </div>
</template>

<script>
/* Tirofijo · motor común de detección y puntuación (versión PC, varios puestos a la vez)
   Sale del motor de index.html (v25.4): mismas funciones, pero cada puesto tiene su propio estado.
   Uso: const m = TirofijoMotor.create(videoEl, canvasEl);  cada fotograma: m.step();
   El lienzo tiene la misma proporción que el vídeo (ambos con object-fit:contain), así la calibración
   se guarda en fracciones del fotograma y no depende del tamaño de la ventana. */
(function(){
const TARGETS={
  p25 :{name:'Pistola 25/50 m (precisión)', D:500,   r:[0,500,450,400,350,300,250,200,150,100,50],          black:200,   x:25},
  ap10:{name:'Pistola aire 10 m',           D:155.5, r:[0,155.5,139.5,123.5,107.5,91.5,75.5,59.5,43.5,27.5,11.5], black:59.5, x:5,   cal:4.5},
  ar10:{name:'Carabina aire 10 m',          D:45.5,  r:[0,45.5,40.5,35.5,30.5,25.5,20.5,15.5,10.5,5.5,0.5],     black:30.5,  x:0,   cal:4.5},
  r50 :{name:'Carabina 50 m',               D:154.4, r:[0,154.4,138.4,122.4,106.4,90.4,74.4,58.4,42.4,26.4,10.4], black:112.4, x:5,  cal:5.6},
};
const MODALS={issf:{name:'ISSF',scoreRule:'edge',bestOf:0,shotLimit:0}, avancarga:{name:'Avancarga (.45 · 13 disparos, cuentan 10)',scoreRule:'center',bestOf:10,shotLimit:13,caliber:11.43}};
const SAVE_KEYS=['target','rings','realmm','caliber','detectType','dianaMode','persp','center','edge','radiusPct','modal','scoreRule','bestOf','shotLimit',
  'thr','minpx','cooldown','holeSens','confirm','laserMax','roundMax','insideOnly','lightComp','backlit','countOut','askShot','ringColor','ringW','minRing','gun'];
const BASE_W=960;    // ancho del lienzo de trabajo (la altura sigue la proporción del vídeo)

function create(video, overlay){
  const octx=overlay.getContext('2d');
  const work=document.createElement('canvas');
  const wctx=work.getContext('2d',{willReadFrequently:true});
  const S={
    running:true, fireMode:'auto', dianaMode:'standard', detectType:'laser',
    thr:160, minpx:4, cooldown:0.5, rings:10, radiusPct:42, realmm:500,
    fit:'contain', ringColor:'#ff2bd6', ringW:1.2, minRing:1, scoreRule:'edge', bestOf:0, shotLimit:0, modal:'issf',
    holeThr:45, minHole:6, maxHole:400, confirm:3, roundMax:2.6, laserMax:1.0, holeSens:5, caliber:9, target:'p25', gun:'pistol',
    insideOnly:true, lightComp:true, backlit:false, countOut:true, askShot:true, persp:{top:null,right:null,bottom:null,left:null,center:null}, Hf:null, Hinv:null, selP:'center',
    lastShot:0, shots:[], W:0, H:0, center:null, edge:null, phase:'idle',
  };
  const Z={s:1};
  const E={S, TARGETS, MODALS, armed:false, liveRed:'', onShot:null, onEnd:null, lastLive:0};

  function solveLin(A,b){ // elimina Gauss, A n×n
    const n=b.length;
    for(let c=0;c<n;c++){
      let piv=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[piv][c])) piv=r;
      [A[c],A[piv]]=[A[piv],A[c]]; [b[c],b[piv]]=[b[piv],b[c]];
      const d=A[c][c]||1e-9;
      for(let r=0;r<n;r++){ if(r===c) continue; const f=A[r][c]/d;
        for(let k=c;k<n;k++) A[r][k]-=f*A[c][k]; b[r]-=f*b[c]; }
    }
    return b.map((v,i)=>v/(A[i][i]||1e-9));
  }
  function homography(src,dst){ // 4 puntos {x,y} -> H (img a destino)
    const A=[],bb=[];
    for(let i=0;i<4;i++){ const {x,y}=src[i], X=dst[i].x, Y=dst[i].y;
      A.push([x,y,1,0,0,0,-x*X,-y*X]); bb.push(X);
      A.push([0,0,0,x,y,1,-x*Y,-y*Y]); bb.push(Y); }
    const h=solveLin(A,bb);
    return [[h[0],h[1],h[2]],[h[3],h[4],h[5]],[h[6],h[7],1]];
  }
  function applyH(H,x,y){ const d=H[2][0]*x+H[2][1]*y+H[2][2];
    return {x:(H[0][0]*x+H[0][1]*y+H[0][2])/d, y:(H[1][0]*x+H[1][1]*y+H[1][2])/d}; }
  function inv3(m){
    const a=m[0][0],b=m[0][1],c=m[0][2],d=m[1][0],e=m[1][1],f=m[1][2],g=m[2][0],h=m[2][1],i=m[2][2];
    const A=e*i-f*h,B=-(d*i-f*g),C=d*h-e*g,D=-(b*i-c*h),E=a*i-c*g,F=-(a*h-b*g),G=b*f-c*e,Hh=-(a*f-c*d),I=a*e-b*d;
    const det=a*A+b*B+c*C||1e-9;
    return [[A/det,D/det,G/det],[B/det,E/det,Hh/det],[C/det,F/det,I/det]];
  }
  // homografía por mínimos cuadrados ponderados (más de 4 puntos; el de más peso queda casi exacto)
  function homographyLS(src,dst,w){
    // normaliza los puntos de imagen (centroide en 0, distancia media √2) para que el cálculo sea estable
    const mx=src.reduce((a,p)=>a+p.x,0)/src.length, my=src.reduce((a,p)=>a+p.y,0)/src.length;
    const md=src.reduce((a,p)=>a+Math.hypot(p.x-mx,p.y-my),0)/src.length||1, k=Math.SQRT2/md;
    const ns=src.map(p=>({x:(p.x-mx)*k, y:(p.y-my)*k}));
    const M=Array.from({length:8},()=>new Array(8).fill(0)), v=new Array(8).fill(0);
    const add=(row,val,wt)=>{ for(let a=0;a<8;a++){ v[a]+=wt*row[a]*val; for(let b=0;b<8;b++) M[a][b]+=wt*row[a]*row[b]; } };
    for(let i=0;i<ns.length;i++){ const {x,y}=ns[i], X=dst[i].x, Y=dst[i].y;

    // 3) sin nada nuevo durante 1 s: la referencia se actualiza (absorbe impactos ya contados y cambios lentos de luz)
    if(!ok.length){ avgUpd(); if(!HD.quietSince) HD.quietSince=now; else if(now-HD.quietSince>=1000){ setBase(Float32Array.from(HD.avg)); HD.quietSince=now; } }
    else HD.quietSince=0;
    // muchas manchas a la vez no son disparos (luz, enfoque, compresión): no se cuenta nada y, si sigue, nueva referencia
    if(ok.filter(c=>c.ni>0.5*c.n).length>=5){ HD.cands=[]; avgUpd(); if(!HD.burstSince) HD.burstSince=now;
      else if(now-HD.burstSince>1500){ HD.avg=Float32Array.from(cur); HD.avgN=1; setBase(cur); HD.burstSince=0; }
      say('Muchos cambios a la vez: ignorados','mov'); return null; }
    HD.burstSince=0;

    // un agujero se queda; una sombra o el papel que se mueve, no
    const prev=HD.cands||[], next=[], fired=[], used=new Set();
    for(const c of ok){
      const m=prev.find(p=>Math.hypot(c.cx-p.x,c.cy-p.y)<=Math.max(4,hs.d)), t0=m?m.t0:now;

  /* ---------- dibujo overlay ---------- */
  function normToScreen(rx,ry){ // normalizado -> pantalla (según modo)
    if(S.dianaMode==='persp' && S.Hinv){ return applyH(S.Hinv,rx,ry); }

  }
  function drawDiana(){
    octx.clearRect(0,0,S.W,S.H);

      const cx=S.W/2, cy=S.H/2; octx.strokeStyle='rgba(248,81,73,.9)'; octx.lineWidth=2;
      octx.beginPath(); octx.moveTo(cx-22,cy); octx.lineTo(cx+22,cy);
      octx.moveTo(cx,cy-22); octx.lineTo(cx,cy+22); octx.stroke();
      octx.beginPath(); octx.arc(cx,cy,3,0,7); octx.fillStyle='rgba(248,81,73,.9)'; octx.fill();

    }

    let offS=null; if(S.detectType==='holes' && HD.R && HD.curA && HD.curA!==AFF_I){
      // pantalla(calibración) → pantalla(ahora): S∘curA⁻¹∘S⁻¹ (roiToScreen es lineal)
      const R=HD.R, Ai=affInv(HD.curA), o=roiToScreen(R,0,0), ux=roiToScreen(R,1,0), uy=roiToScreen(R,0,1);
      const sx=ux.x-o.x, sy=uy.y-o.y, T=[Ai[0], Ai[1]*sx/sy, (Ai[2]+Ai[0]*(-o.x/sx)+Ai[1]*(-o.y/sy))*sx+o.x, Ai[3]*sy/sx, Ai[4], (Ai[5]+Ai[3]*(-o.x/sx)+Ai[4]*(-o.y/sy))*sy+o.y];

  function drawRings(RAD,NR){
    if(S.dianaMode==='persp' && S.Hinv){
      for(let v=Math.min(NR,S.minRing||1); v<=NR; v++){
        const rr=RAD[v]; octx.beginPath();
        for(let a=0;a<=64;a++){ const t=a/64*Math.PI*2, p=normToScreen(rr*Math.cos(t), rr*Math.sin(t));
          if(a===0)octx.moveTo(p.x,p.y); else octx.lineTo(p.x,p.y); }
        strokeRing(v===(S.minRing||1));

      const c=normToScreen(0,0); drawCross(c.x,c.y);
    } else {
      const {cx,cy,rOuter}=dianaGeom();
      for(let v=Math.min(NR,S.minRing||1); v<=NR; v++){ octx.beginPath(); octx.arc(cx,cy,rOuter*RAD[v],0,7); strokeRing(v===(S.minRing||1)); }
      drawCross(cx,cy);
    }
    if(S.dianaMode==='calib'){ if(S.center)mark(S.center.x*S.W,S.center.y*S.H,'#3fb950','C'); if(S.edge)mark(S.edge.x*S.W,S.edge.y*S.H,'#d29922','B'); }
    if(S.dianaMode==='persp'){ const p=S.persp;
      [['top','①'],['right','②'],['bottom','③'],['left','④'],['center','⑤']].forEach(([k,t])=>{
        if(!p[k]) return; const sel=false;
        const x=p[k].x*S.W, y=p[k].y*S.H;
        if(k==='center'){ octx.beginPath(); octx.moveTo(x-7,y); octx.lineTo(x+7,y); octx.moveTo(x,y-7); octx.lineTo(x,y+7);
          octx.strokeStyle='#d29922'; octx.lineWidth=1.5; octx.stroke(); }
        mark(x,y, sel?'#ffffff':'#d29922', t); }); }

    const c0=normToScreen(0,0), ex=normToScreen(1,0), ey=normToScreen(0,1);

    const dot=Math.max(3/(Z.s||1), bulletR()*Rs);

    S.shots.forEach((s,i)=>{ const p=normToScreen(s.rx,s.ry), last=i===S.shots.length-1;
      octx.beginPath(); octx.arc(p.x,p.y,dot,0,7);

        const fs=Math.max(9, 13/Z.s); octx.font='800 '+fs+'px sans-serif'; octx.textAlign='left'; octx.textBaseline='bottom';
        const lx=p.x+dot+1, ly=p.y-dot-1; octx.lineWidth=3/Z.s; octx.strokeStyle='rgba(0,0,0,.9)'; octx.strokeText(i+1,lx,ly);
        octx.fillStyle='#fff'; octx.fillText(i+1,lx,ly); } });

  // (v25.5) si el modelo no cambia se conservan el diámetro real del aro 1 y el calibre

  // punto del lienzo (coordenadas CSS dentro del elemento) -> coordenadas del lienzo de trabajo

// Autocalibrado de la diana: encuentra la zona negra, los aros y la perspectiva a partir de una imagen.
// autoCalib(rgba, W, H, TARGETS) -> {ok, model, k, H (px imagen -> coords normalizadas, radio exterior = 1),
//                                    rings:[{r, n}], rmsMM, msg}
function autoCalib(rgba, W, H, TARGETS){
  const N=W*H, g=new Float32Array(N);
  for(let i=0,j=0;i<N;i++,j+=4) g[i]=0.299*rgba[j]+0.587*rgba[j+1]+0.114*rgba[j+2];

  // ---------- 1. zona negra: umbral de Otsu + cierre morfológico + mancha oscura más "redonda y llena" ----------
  const hist=new Float64Array(256); for(let i=0;i<N;i++) hist[g[i]|0]++;
  let sum=0; for(let i=0;i<256;i++) sum+=i*hist[i];
  let wB=0, sB=0, best=0, thr=100;
  for(let t=0;t<256;t++){ wB+=hist[t]; if(!wB) continue; const wF=N-wB; if(!wF) break; sB+=t*hist[t];
    const mB=sB/wB, mF=(sum-sB)/wF, v=wB*wF*(mB-mF)*(mB-mF); if(v>best){ best=v; thr=t; } }
  // segundo Otsu dentro de lo oscuro: separa el negro de la diana de fondos grises (pared, cartón)
  let thr2=thr; { let n2=0,s2=0; for(let i=0;i<thr;i++){ n2+=hist[i]; s2+=i*hist[i]; }
    let w=0,sb=0,bv=0; for(let t=0;t<thr;t++){ w+=hist[t]; if(!w) continue; const wf=n2-w; if(!wf) break; sb+=t*hist[t];
      const a=sb/w, b=(s2-sb)/wf, v=w*wf*(a-b)*(a-b); if(v>bv){ bv=v; thr2=t; } } }
  const rad=Math.max(1,Math.round(Math.min(W,H)/320));            // cierra las líneas blancas finas de la zona negra
  const box=(src,val)=>{ // dilata (val=1) o erosiona (val=0) con una caja de (2·rad+1)
    const a=new Uint8Array(N), b=new Uint8Array(N);
    for(let y=0;y<H;y++){ let c=0; const o=y*W;
      for(let x=-rad;x<W+rad;x++){ const xi=x+rad; if(xi<W) c+=(src[o+xi]===val)?1:0; const xo=x-rad-1; if(xo>=0) c-=(src[o+xo]===val)?1:0;
        if(x>=0&&x<W) a[o+x]=c>0?val:1-val; } }
    for(let x=0;x<W;x++){ let c=0;
      for(let y=-rad;y<H+rad;y++){ const yi=y+rad; if(yi<H) c+=(a[yi*W+x]===val)?1:0; const yo=y-rad-1; if(yo>=0) c-=(a[yo*W+x]===val)?1:0;
        if(y>=0&&y<H) b[y*W+x]=c>0?val:1-val; } }
    return b; };
  const lab=new Int32Array(N), stack=new Int32Array(N);
  let bc=null, bs=0;
  for(const th of (thr2<thr-15?[thr,thr2]:[thr])){
    let m=new Uint8Array(N); for(let i=0;i<N;i++) m[i]=g[i]<th?1:0;
    m=box(box(m,1),0);
    lab.fill(-1); const comps=[];
    for(let s=0;s<N;s++){ if(!m[s]||lab[s]>=0) continue;
      let sp=0; stack[sp++]=s; const id=comps.length; lab[s]=id;
      let n=0,sx=0,sy=0,sxx=0,syy=0,sxy=0,touch=0,sg=0,x0=W,x1=0,y0=H,y1=0;
      while(sp){ const i=stack[--sp], x=i%W, y=(i-x)/W; n++; sx+=x; sy+=y; sxx+=x*x; syy+=y*y; sxy+=x*y; sg+=g[i];
        if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
        if(x===0||y===0||x===W-1||y===H-1) touch++;
        if(x>0&&m[i-1]&&lab[i-1]<0){lab[i-1]=id;stack[sp++]=i-1;}
        if(x<W-1&&m[i+1]&&lab[i+1]<0){lab[i+1]=id;stack[sp++]=i+1;}
        if(y>0&&m[i-W]&&lab[i-W]<0){lab[i-W]=id;stack[sp++]=i-W;}
        if(y<H-1&&m[i+W]&&lab[i+W]<0){lab[i+W]=id;stack[sp++]=i+W;} }
      comps.push({id,n,sx,sy,sxx,syy,sxy,touch,mean:sg/n,x0,x1,y0,y1}); }
    for(const c of comps){ if(c.n<0.003*N) continue;
      const mx=c.sx/c.n, my=c.sy/c.n, cxx=c.sxx/c.n-mx*mx, cyy=c.syy/c.n-my*my, cxy=c.sxy/c.n-mx*my;
      const tr=(cxx+cyy)/2, dd=Math.sqrt(((cxx-cyy)/2)**2+cxy*cxy), l1=tr+dd, l2=Math.max(1e-9,tr-dd);
      const a=2*Math.sqrt(l1), b=2*Math.sqrt(l2), phi=0.5*Math.atan2(2*cxy,cxx-cyy);
      if(b/a<0.35) continue;
      // parecido a una elipse llena: intersección / unión con su elipse de momentos
      const cp=Math.cos(phi), sp2=Math.sin(phi); let inE=0, inC=0, ae=0;
      const X0=Math.max(0,Math.floor(mx-a-2)), X1=Math.min(W-1,Math.ceil(mx+a+2)), Y0=Math.max(0,Math.floor(my-a-2)), Y1=Math.min(H-1,Math.ceil(my+a+2));
      for(let y=Y0;y<=Y1;y++) for(let x=X0;x<=X1;x++){ const dx=x-mx, dy=y-my, u=(dx*cp+dy*sp2)/a, v=(-dx*sp2+dy*cp)/b, ins=u*u+v*v<=1;
        if(ins){ ae++; if(lab[y*W+x]===c.id) inE++; } }
      const iou=inE/(c.n+ae-inE);
      if(iou<0.75) continue;
      const touchF=c.touch>0.02*Math.sqrt(c.n)?0.15:1;
      const sc=Math.sqrt(c.n)*Math.pow(iou,4)*(1-c.mean/255)*touchF;
      if(sc>bs){ bs=sc; bc={mx,my,a,b,phi,iou,mean:c.mean}; } }
  }
  if(!bc) return {ok:false, msg:'No encuentro la zona negra de la diana. Comprueba que se ve entera y bien iluminada.'};

  // ---------- 2. perfiles radiales: líneas de los aros (oscuras fuera de la zona negra, claras dentro) ----------
  const cph=Math.cos(bc.phi), sph=Math.sin(bc.phi);
  const e1=[cph*bc.a, sph*bc.a], e2=[-sph*bc.b, cph*bc.b];
  const samp=(x,y)=>{ if(x<0||y<0||x>W-1.001||y>H-1.001) return NaN; const x0=x|0, y0=y|0, fx=x-x0, fy=y-y0, i=y0*W+x0;
    return (g[i]*(1-fx)+g[i+1]*fx)*(1-fy)+(g[i+W]*(1-fx)+g[i+W+1]*fx)*fy; };
  const NR=240, S0=0.06, S1=3.3, DS=0.0035, NS=Math.round((S1-S0)/DS)+1;
  const rays=[]; const valid=new Float32Array(NS);
  for(let q=0;q<NR;q++){
    const th=2*Math.PI*q/NR, ux=Math.cos(th), uy=Math.sin(th);
    const dx=ux*e1[0]+uy*e2[0], dy=ux*e1[1]+uy*e2[1], pxPerS=Math.hypot(dx,dy);
    const I=new Float32Array(NS); for(let k=0;k<NS;k++){ const s=S0+k*DS; I[k]=samp(bc.mx+s*dx, bc.my+s*dy); if(!isNaN(I[k])) valid[k]++; }
    const w=Math.max(2,Math.round(2.5/(DS*pxPerS)));
    const med=(lo,hi)=>{ const v=[]; for(let k=Math.round((lo-S0)/DS);k<=Math.round((hi-S0)/DS);k++) if(k>=0&&k<NS&&!isNaN(I[k])) v.push(I[k]); v.sort((a,b)=>a-b); return v.length?v[v.length>>1]:NaN; };
    const wh=med(1.08,1.3), bl=med(0.45,0.9), con=Math.abs(wh-bl);
    const thrR=Math.max(4,0.12*(isNaN(con)?40:con));
    const L=new Float32Array(NS);
    for(let k=w;k<NS-w;k++){ const s=S0+k*DS, a=I[k-w], b=I[k+w], c=I[k]; if(isNaN(a)||isNaN(b)||isNaN(c)) continue;
      L[k]= s>1.03 ? (a+b)/2-c : (s<0.97 ? c-(a+b)/2 : 0); }
    const peaks=[];
    for(let k=w;k<NS-w;k++){ if(L[k]<thrR) continue; let mx=true; const h=Math.max(1,w>>1);
      for(let j=1;j<=h;j++) if(L[k-j]>L[k]||L[k+j]>=L[k]){ mx=false; break; } if(!mx) continue;
      const y0=L[k-1], y1=L[k], y2=L[k+1], den=y0-2*y1+y2, off=den<0?0.5*(y0-y2)/den:0;
      peaks.push(S0+(k+off)*DS); }
    // borde de la zona negra: mayor subida de brillo entre s=0.8 y 1.2
    let eb=-1, ev=0; for(let k=Math.round((0.8-S0)/DS);k<=Math.round((1.2-S0)/DS);k++){ if(k-w<0||k+w>=NS) continue;
      const d=I[k+w]-I[k-w]; if(!isNaN(d)&&d>ev){ ev=d; eb=S0+k*DS; } }
    rays.push({dx,dy,peaks,edge: ev>Math.max(8,0.3*(isNaN(con)?40:con))?eb:null});
  }
  // ---------- 3. cadenas: cada aro es una curva continua de picos de rayo en rayo ----------
  const chains=[]; let open=[];
  for(let q=0;q<NR;q++){
    const pk=rays[q].peaks, used=new Uint8Array(pk.length), nx=[];
    open.sort((a,b)=>a.last-b.last);
    for(const ch of open){ let bi=-1, bd=0.022+0.012*ch.last;
      for(let i=0;i<pk.length;i++){ if(used[i]) continue; const d=Math.abs(pk[i]-ch.last); if(d<bd){ bd=d; bi=i; } }
      if(bi>=0){ used[bi]=1; ch.pts.push({q,s:pk[bi]}); ch.last=pk[bi]; ch.gap=0; nx.push(ch); }
      else if(ch.gap<4){ ch.gap++; nx.push(ch); } }
    for(let i=0;i<pk.length;i++) if(!used[i]){ const ch={pts:[{q,s:pk[i]}], last:pk[i], gap:0}; chains.push(ch); nx.push(ch); }
    open=nx; }
  // une las cadenas que dan la vuelta completa (fin cerca del rayo NR-1 con principio cerca del 0)
  for(const a of chains){ if(a.dead) continue; const qe=a.pts[a.pts.length-1].q; if(qe<NR-5) continue;
    for(const b of chains){ if(b===a||b.dead) continue; if(b.pts[0].q>4) continue;
      if(Math.abs(b.pts[0].s-a.pts[a.pts.length-1].s)<0.03+0.012*b.pts[0].s){ a.pts=a.pts.concat(b.pts); b.dead=true; break; } } }
  const good=chains.filter(c=>!c.dead && new Set(c.pts.map(p=>p.q)).size>=0.25*NR)
    .map(c=>({pts:c.pts, s:c.pts.map(p=>p.s).sort((a,b)=>a-b)[c.pts.length>>1]})).sort((a,b)=>a.s-b.s);
  const edgePts=rays.map((r,q)=>r.edge!=null?{q,s:r.edge}:null).filter(Boolean);
  if(good.length<2 || edgePts.length<0.25*NR)
    return {ok:false, msg:'No distingo los aros de la diana. Acerca la cámara o mejora la luz frontal.', dbg:{bc, nch:good.length, ne:edgePts.length}};

  // ---------- 4. homografía con radios libres por aro (corrige la perspectiva sin saber aún el modelo) ----------
  const sc=bc.a, cx=bc.mx, cy=bc.my;
  const toXY=(q,s)=>{ const r=rays[q]; return {x:(bc.mx+s*r.dx-cx)/sc, y:(bc.my+s*r.dy-cy)/sc}; };
  const groups=[{fixed:1, pts:edgePts.map(p=>toXY(p.q,p.s))}].concat(good.map(c=>({fixed:null, s0:c.s, pts:c.pts.map(p=>toXY(p.q,p.s))})));
  const gauss=(M,v)=>{ const n=v.length, A=M.map((r,i)=>r.concat([v[i]]));
    for(let c=0;c<n;c++){ let pr=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[pr][c])) pr=r;
      if(Math.abs(A[pr][c])<1e-15) return null; [A[c],A[pr]]=[A[pr],A[c]];
      for(let r=0;r<n;r++){ if(r===c) continue; const f=A[r][c]/A[c][c]; for(let k=c;k<=n;k++) A[r][k]-=f*A[c][k]; } }
    return A.map((r,i)=>r[n]/r[i]); };
  // params: 8 de la homografía + un radio por grupo libre. residuo = |H(p)| - R
  function makeRes(G){ return pp=>{ const out=[]; let fi=8;
    for(const gr of G){ const R=gr.fixed!=null?gr.fixed:pp[fi++];
      for(const q of gr.pts){ const w=pp[6]*q.x+pp[7]*q.y+1; out.push(Math.hypot((pp[0]*q.x+pp[1]*q.y+pp[2])/w,(pp[3]*q.x+pp[4]*q.y+pp[5])/w)-R); } }
    return out; }; }
  function lm(pp,resf,iters){
    let mu=1e-3, r=resf(pp), c=r.reduce((a,v)=>a+v*v,0); const n=pp.length;
    for(let it=0;it<iters;it++){
      const J=[]; for(let j=0;j<n;j++){ const q=pp.slice(), h=1e-6*Math.max(1e-3,Math.abs(pp[j])); q[j]+=h; const r2=resf(q); J.push(r2.map((v,i)=>(v-r[i])/h)); }
      const A=[...Array(n)].map(()=>new Array(n).fill(0)), gv=new Array(n).fill(0);
      for(let a=0;a<n;a++){ for(let b=a;b<n;b++){ let s=0; const Ja=J[a], Jb=J[b]; for(let i=0;i<r.length;i++) s+=Ja[i]*Jb[i]; A[a][b]=A[b][a]=s; }
        let s=0; for(let i=0;i<r.length;i++) s+=J[a][i]*r[i]; gv[a]=s; }
      let improved=false;
      for(let tries=0;tries<8;tries++){
        const M=A.map((row,i)=>{ const rr=row.slice(); rr[i]+=mu*(row[i]+1e-12); return rr; });
        const d=gauss(M,gv.map(v=>-v)); if(!d){ mu*=10; continue; }
        const q=pp.map((v,i)=>v+d[i]), r2=resf(q), c2=r2.reduce((a,v)=>a+v*v,0);
        if(c2<c){ const rel=(c-c2)/c; pp=q; r=r2; c=c2; mu=Math.max(1e-9,mu/3); improved=true; if(rel<1e-10) it=iters; break; }
        mu*=8; }
      if(!improved) break; }
    return {p:pp, r, c}; }
  const trimG=(G,r)=>{ const a=r.map(Math.abs).sort((x,y)=>x-y), lim=Math.max(3*1.4826*a[a.length>>1], 0.003); let i=0;
    return G.map(gr=>({...gr, pts:gr.pts.filter(()=>Math.abs(r[i++])<=lim)})).filter(gr=>gr.pts.length>=8); };
  let p0=[cph/bc.a*sc, sph/bc.a*sc, 0, -sph/bc.b*sc, cph/bc.b*sc, 0, 0, 0].concat(good.map(c=>c.s));
  let G=groups, fit=lm(p0,makeRes(G),60);
  const keep=fit.p.slice(8); G=G.map((gr,i)=>i?{...gr, s0:keep[i-1]}:gr);
  G=trimG(G,fit.r); fit=lm(fit.p.slice(0,8).concat(G.slice(1).map(gr=>gr.s0)),makeRes(G),60);
  const rho=fit.p.slice(8);                         // radio de cada aro / radio de la zona negra (sin perspectiva)

  // ---------- 5. modelo de diana que encaja con esos radios ----------
  let bestM=null;
  for(const [key,t] of Object.entries(TARGETS)){
    const xs=t.r.slice(1).map(d=>d/t.black);
    for(let k=0.93;k<=1.0701;k+=0.0025){      // escala libre: el borde de la zona negra puede salir algo desplazado
      let mt=0, se=0; const asg=[];
      for(const r of rho){ let bj=-1, bd=1; xs.forEach((x,j)=>{ if(x<0.1||Math.abs(x-1)<0.03) return; const d=Math.abs(Math.log(r/(k*x))); if(d<bd){ bd=d; bj=j; } });
        if(bd<0.02){ mt++; se+=bd*bd; asg.push(bj+1); } else asg.push(0); }
      const sc2=mt - Math.sqrt(se/Math.max(1,mt))*40 - Math.abs(Math.log(k))*5;
      if(!bestM || sc2>bestM.sc) bestM={key,t,mt,sc:sc2,asg,k}; } }
  let model, t, asg;
  if(bestM && bestM.mt>=2 && bestM.mt>=0.6*rho.length){ model=bestM.key; t=bestM.t; asg=bestM.asg; }
  else {   // desconocida: aros iguales, el más exterior es el borde
    const all=[1].concat(rho).sort((a,b)=>a-b), ds=[]; for(let i=1;i<all.length;i++) ds.push(all[i]-all[i-1]); ds.sort((a,b)=>a-b);
    const sp=ds[ds.length>>1], outer=all[all.length-1], n=Math.max(3,Math.min(12,Math.round(outer/sp)));
    const r=[0]; for(let v=1;v<=n;v++) r.push((n-v+1)/n);
    t={D:1, r, black:1/outer, n}; model='custom';
    asg=rho.map(x=>{ const v=n+1-Math.round(x/outer*n); return v>=1&&v<=n?v:0; }); }
  const D=t.D;
  // ---------- 6. ajuste final con los radios reales del modelo ----------
  let GF=[];
  G.slice(1).forEach((gr,i)=>{ const v=asg[i]; if(v>0) GF.push({fixed:t.r[v]/D, pts:gr.pts}); });
  if(GF.length<3) GF.unshift({fixed:t.black/D, pts:G[0].pts});   // el borde negro solo si hay pocos aros
  const k0=t.black/D/(bestM&&bestM.k||1);   // de unidades de "zona negra" a radio exterior = 1
  let pf=fit.p.slice(0,8); pf=[pf[0]*k0,pf[1]*k0,pf[2]*k0,pf[3]*k0,pf[4]*k0,pf[5]*k0,pf[6],pf[7]];
  let ff=lm(pf,makeRes(GF),60); GF=trimG(GF,ff.r); ff=lm(ff.p,makeRes(GF),60);
  const npts=GF.reduce((a,g)=>a+g.pts.length,0), rms=Math.sqrt(ff.c/npts);
  const q=ff.p, Hs=[[q[0],q[1],q[2]],[q[3],q[4],q[5]],[q[6],q[7],1]], T=[[1/sc,0,-cx/sc],[0,1/sc,-cy/sc],[0,0,1]];
  const Hpx=[]; for(let r=0;r<3;r++) for(let c=0;c<3;c++){ let s=0; for(let k=0;k<3;k++) s+=Hs[r][k]*T[k][c]; Hpx.push(s); }
  return {ok:true, model, n:t.n||10, H:Hpx, rmsMM:model==='custom'?0:rms*D/2, rmsN:rms, rings:GF.length, pts:npts, black:bc, rho, asg, k:1, ng:G.map(g=>g.pts.length)};
}

window.TirofijoMotor={create, TARGETS, MODALS, autoCalib};
})();

</script>
<script>
(() => {
  const PCVER='v1.3', PCDATE='26-11-26';    // versión visible: cambiar en cada versión
  const $=s=>document.querySelector(s);
  $('#appVer').textContent='Versión '+PCVER+' · actualizada el '+PCDATE;
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const LS=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } };
  const f1=v=>(Math.round(v*10)/10).toFixed(1).replace('.',',');
  const log=t=>{ const el=$('#log'); el.textContent=(new Date().toLocaleTimeString()+'  '+t+'\n'+el.textContent).slice(0,5000); };
  const say=(t,err)=>{ const s=$('#state'); s.textContent=t; s.classList.toggle('err',!!err); if(err) $('#cfg').classList.remove('hide'); };
  if(!window.TirofijoMotor){ say('Error interno: falta el motor',1); return; }
  const {TARGETS, MODALS}=TirofijoMotor;

  const servedByG2r = location.port==='1984';
  $('#g2r').value = LS('pc_g2r') || LS('galeria_g2r') || (servedByG2r ? location.origin : 'http://localhost:1984');
  $('#colsSel').value = LS('pc_cols') || '0';

  const P=[];     // puestos: {id, key, label, src:{kind,name|deviceId}, el, video, canvas, m, stream, pc, …}
  let seq=0;

  /* ---------- vídeo ---------- */
  async function pullG2r(src){
    const base=$('#g2r').value.replace(/\/$/,'');
    const pc=new RTCPeerConnection({iceServers:[]});
    pc.addTransceiver('video',{direction:'recvonly'});
    const ms=new MediaStream(); pc.ontrack=e=>ms.addTrack(e.track);
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise(r=>{ if(pc.iceGatheringState==='complete') return r();
      const t=setTimeout(r,1500); pc.addEventListener('icegatheringstatechange',()=>{ if(pc.iceGatheringState==='complete'){ clearTimeout(t); r(); } }); });
    const res=await fetch(base+'/api/webrtc?src='+encodeURIComponent(src),{method:'POST',headers:{'Content-Type':'application/sdp'},body:pc.localDescription.sdp});
    if(!res.ok){ pc.close(); throw new Error('go2rtc '+res.status); }
    await pc.setRemoteDescription({type:'answer',sdp:await res.text()});
    await new Promise((ok,ko)=>{ const t=setTimeout(()=>ko(new Error('sin imagen')),8000);
      const chk=()=>{ if(ms.getVideoTracks().length){ clearTimeout(t); ok(); } }; pc.addEventListener('track',chk); chk(); });
    return {pc, stream:ms};
  }
  async function connect(p){
    if(p.connecting) return; p.connecting=true; msg(p,'Conectando…');
    try{
      closeMedia(p);
      if(p.src.kind==='g2r'){ const g=await pullG2r(p.src.name); p.pc=g.pc; p.stream=g.stream;
        p.pc.addEventListener('iceconnectionstatechange',()=>{ if(['failed','closed','disconnected'].includes(p.pc&&p.pc.iceConnectionState)) p.stallSince=p.stallSince||performance.now(); }); }
      else { p.stream=await navigator.mediaDevices.getUserMedia({video:{deviceId:p.src.deviceId?{exact:p.src.deviceId}:undefined, width:{ideal:1920}, height:{ideal:1080}}, audio:false}); }
      p.video.srcObject=p.stream; await p.video.play().catch(()=>{});
      p.lastT=-1; p.stallSince=0; p.fails=0; msg(p,''); log(p.label+': imagen conectada');
      if(p.recWanted && !p.rec && p.m.armed) recStart(p);      // la grabación sigue en otro archivo
    }catch(e){ p.fails=(p.fails||0)+1; msg(p,'Sin imagen: '+e.message+' · reintento en '+Math.min(30,3*p.fails)+' s'); log(p.label+': '+e.message);
      p.retryAt=performance.now()+Math.min(30000,3000*p.fails); }
    finally{ p.connecting=false; }
  }
  function closeMedia(p){
    if(p.rec){ try{ p.rec.rec.stop(); }catch(e){} }    // guarda lo grabado hasta aquí
    try{ p.pc&&p.pc.close(); }catch(e){} p.pc=null;
    if(p.stream && p.src.kind==='cam') p.stream.getTracks().forEach(t=>t.stop());
    p.stream=null; if(p.video) p.video.srcObject=null;
  }
  // vigilancia: si la imagen se congela o el enlace cae, se vuelve a conectar sola
  setInterval(()=>{ const now=performance.now();
    P.forEach(p=>{ if(p.connecting) return;
      if(!p.stream){ if(!p.retryAt||now>=p.retryAt) connect(p); return; }
      const t=p.video.currentTime;
      if(t!==p.lastT){ p.lastT=t; p.stallSince=0; if(p.msgTxt&&p.msgTxt.startsWith('Imagen congelada')) msg(p,''); return; }
      if(!p.stallSince) p.stallSince=now;
      if(now-p.stallSince>6000){ msg(p,'Imagen congelada: reconectando…'); log(p.label+': imagen congelada, reconecto'); p.retryAt=0; connect(p); }
    }); },2000);

  /* ---------- puestos ---------- */
  function cfgKey(p){ return 'tirofijo_pc_'+p.key; }
  function persist(p){ try{ LS(cfgKey(p), JSON.stringify({m:p.m.save(), shooter:p.shooter||''})); }catch(e){} }
  function addPuesto(src, label){
    const key=src.kind==='g2r' ? 'g2r:'+src.name : 'cam:'+(src.label||src.deviceId);
    if(P.some(p=>p.key===key)) return;
    const el=$('#tileTpl').content.firstElementChild.cloneNode(true);

    try{ const o=JSON.parse(LS(cfgKey(p))||'null'); if(o){ p.m.load(o.m); p.shooter=o.shooter||''; } }catch(e){}
    p.m.onShot=sh=>onShot(p,sh);
    p.m.onEnd=()=>{ msg(p,'Tirada completa ('+p.m.S.shotLimit+' disparos)'); setTimeout(()=>msg(p,''),4000); recStop(p); paint(p); };
    p.m.onAsk=()=>askOpen(p);
    el.dataset.id=p.id;
    el.querySelector('.src').textContent=src.kind==='g2r'?src.name:'webcam';
    const sh=el.querySelector('.shooter'); sh.value=p.shooter||''; sh.oninput=()=>{ p.shooter=sh.value; persist(p); };
    // selectores de la vista ampliada
    const st=el.querySelector('.selTarget');
    st.innerHTML=Object.entries(TARGETS).map(([k,t])=>'<option value="'+k+'">'+esc(t.name)+'</option>').join('')+'<option value="custom">Personalizada</option>';
    st.onchange=()=>{ p.m.setTarget(st.value); preFill(p); persist(p); paint(p); };
    const sm=el.querySelector('.selModal');
    sm.innerHTML=Object.entries(MODALS).map(([k,t])=>'<option value="'+k+'">'+esc(t.name)+'</option>').join('');
    sm.onchange=()=>{ p.m.setModal(sm.value); preFill(p); persist(p); paint(p); };
    const ss=el.querySelector('.selSens'); ss.oninput=()=>{ p.m.S.holeSens=+ss.value; persist(p); paint(p); };
    // diámetro real del aro 1 y calibre (v25.6): se confirman antes de cada sesión
    [['.qAro','.qAroMm'],['.qCal','.qCalMm']].forEach(([sel,inp])=>{ const S_=el.querySelector(sel), I_=el.querySelector(inp);
      S_.onchange=()=>{ I_.style.display=S_.value==='otro'?'':'none'; if(S_.value==='otro') I_.focus(); else preApply(p,true); };
      I_.onchange=()=>preApply(p,true); });
    p.preOk=false; preFill(p);
    p.m.onBig=()=>{ msg(p,'⚠ Los impactos se ven más grandes que el calibre: revisa calibre y diámetro real del aro 1'); setTimeout(()=>msg(p,''),9000); };
    if(src.kind!=='cam') el.querySelector('.qcamT').textContent='Enfoque y exposición se ajustan en la propia cámara IP.';
    const cO=el.querySelector('.cOut'), cA=el.querySelector('.cAsk');
    cO.onchange=()=>{ p.m.S.countOut=cO.checked; p.m.resetRef(); persist(p); };
    cA.onchange=()=>{ p.m.S.askShot=cA.checked; if(!cA.checked) askClose(p); persist(p); };
    // marcar / quitar impactos a mano en la vista ampliada
    p.canvas.addEventListener('click',e=>{ const r=p.canvas.getBoundingClientRect();
      if(p.addNext){ askClose(p); p.m.addShotCss(e.clientX-r.left,e.clientY-r.top); persist(p); return; }   // tras «¿disparo?» → ➕
      if(!el.classList.contains('big')||!e.shiftKey) return;
      p.m.addShotCss(e.clientX-r.left,e.clientY-r.top); persist(p); });
    p.canvas.addEventListener('contextmenu',e=>{ if(!el.classList.contains('big')) return; e.preventDefault(); const r=p.canvas.getBoundingClientRect();
      if(p.m.delNearCss(e.clientX-r.left,e.clientY-r.top)) paint(p); });
    P.push(p); renumber(); $('#grid').appendChild(el); paint(p); layout(); connect(p);
  }
  function removePuesto(p){ recStop(p); closeMedia(p); p.el.remove(); P.splice(P.indexOf(p),1); renumber(); layout(); saveList(); }
  function renumber(){ P.forEach((p,i)=>{ p.n=i+1; p.el.querySelector('.pn').textContent='Puesto '+(i+1); }); }
  function saveList(){ LS('pc_cams', JSON.stringify(P.filter(p=>p.src.kind==='cam').map(p=>p.src))); }
  function msg(p,t){ p.msgTxt=t; const m=p.el.querySelector('.msg'); m.textContent=t; m.classList.toggle('show',!!t); }

  function qSelSet(sel, inp, v){ const o=[...sel.options].find(o=>o.value!=='otro'&&Math.abs(+o.value-v)<0.01);
    sel.value=o?o.value:'otro'; inp.style.display=o?'none':''; inp.value=o?'':(v||''); }
  function preFill(p){ const el=p.el; qSelSet(el.querySelector('.qAro'),el.querySelector('.qAroMm'),p.m.targetD());
    qSelSet(el.querySelector('.qCal'),el.querySelector('.qCalMm'),+p.m.S.caliber||0); }
  function preApply(p,quiet){
    const el=p.el, sa=el.querySelector('.qAro'), sc=el.querySelector('.qCal');
    const aro=sa.value==='otro'?+el.querySelector('.qAroMm').value:+sa.value;
    const cal=sc.value==='otro'?p.m.parseCal(el.querySelector('.qCalMm').value):+sc.value;
    if(!(aro>5)){ msg(p,'⚠ Indica el diámetro del aro 1 en mm'); return false; }
    if(!(cal>0.5)){ msg(p,'⚠ Indica el calibre'); return false; }
    p.m.setAroCal(aro,cal); persist(p); paint(p); if(!quiet) msg(p,''); return true;
  }
  function askPre(p){ p.el.classList.add('needPre'); preFill(p);
    msg(p,'Antes de empezar: confirma el diámetro del aro 1 (mídelo con regla) y el calibre'+(p.el.classList.contains('big')?'.':' (⛶).')); }
  function arm(p,on){
    if(on && !p.preOk){ askPre(p); return false; }
    if(on && p.m.S.shotLimit && p.m.S.shots.length>=p.m.S.shotLimit) p.m.clear();
    p.m.armed=on; if(on) recGo(p); else { recPause(p); askClose(p); } paint(p); return true;
  }

  /* ---------- «¿disparo?» (v25.9): la tarjeta se movió pero no apareció agujero nuevo ---------- */
  function askOpen(p){
    const a=p.el.querySelector('.ask'); p.el.querySelector('.askTxt').innerHTML='<b>¿Disparo?</b> La tarjeta se ha movido pero no aparece agujero nuevo (¿balín por un agujero ya hecho o fuera de la tarjeta?)';
    a.classList.add('open'); p.el.classList.add('asking'); clearTimeout(p.askT); p.askT=setTimeout(()=>askClose(p),25000);
    beep(); log(p.label+': ¿disparo? (tarjeta movida sin agujero nuevo)');
  }
  function askClose(p){ p.el.querySelector('.ask').classList.remove('open'); p.el.classList.remove('asking','adding'); p.addNext=false; clearTimeout(p.askT); }
  let actx=null;
  function beep(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain();
    o.frequency.value=660; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(0.25,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+0.35);
    o.start(); o.stop(actx.currentTime+0.36); }catch(e){} }

  /* ---------- GRABACIÓN de cada tirada (v26.0): se guarda en el disco del PC ----------
     Carpeta elegida › Puesto › AAAAMMDD › AAAAMMDDhhmm_Puesto_Tirador.webm + .json (disparos con su momento en el vídeo).
     Sin acceso a carpetas (Safari) se descargan al terminar. */
  const locStamp=d=>{ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+z(d.getHours())+z(d.getMinutes()); };   // (v26.1) hora local
  const safeName=t=>String(t||'').normalize('NFC').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').trim().slice(0,40);
  const REC={on:LS('pc_rep')==='1', dir:null, fs:!!window.showDirectoryPicker, done:[], perm:null};
  const kvDB=()=>new Promise((ok,ko)=>{ const r=indexedDB.open('tirofijo_pc',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); });
  async function kv(k,v){ const db=await kvDB(); return new Promise((ok,ko)=>{ const tx=db.transaction('kv',v===undefined?'readonly':'readwrite'), st=tx.objectStore('kv');
    const rq=v===undefined?st.get(k):st.put(v,k); tx.oncomplete=()=>ok(rq.result); tx.onerror=()=>ko(tx.error); }); }
  function dirUI(){ $('#repOn').checked=REC.on;
    $('#dirName').textContent=!REC.fs?'Este navegador no permite elegir carpeta: los vídeos se descargan':REC.dir?'📁 '+REC.dir.name:'(sin elegir)'; }
  async function pickDir(){
    if(!REC.fs){ dirUI(); return false; }
    try{ REC.dir=await window.showDirectoryPicker({id:'tirofijo', mode:'readwrite', startIn:'videos'}); await kv('dir',REC.dir); REC.perm=null; dirUI(); return true; }
    catch(e){ return false; }
  }
  // permiso de escritura: se pide una vez por clic (el navegador lo exige con un clic del usuario)
  function dirReady(){
    if(!REC.fs) return Promise.resolve(false);
    if(REC.perm) return REC.perm;
    REC.perm=(async()=>{ if(!REC.dir && !(await pickDir())) return false;
      try{ if(await REC.dir.queryPermission({mode:'readwrite'})==='granted') return true;
        return await REC.dir.requestPermission({mode:'readwrite'})==='granted'; }catch(e){ return false; } })();
    REC.perm.then(ok=>{ if(!ok) REC.perm=null; });
    return REC.perm;
  }
  function recGo(p){ if(!REC.on) return; p.recWanted=true;
    if(p.rec){ if(p.rec.paused){ try{ p.rec.rec.resume(); }catch(e){} p.rec.pausedMs+=performance.now()-p.rec.pauseAt; p.rec.paused=false; } return; }
    recStart(p); }
  async function recStart(p){
    if(p.rec || !p.stream || !window.MediaRecorder) return;
    const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
    const mt=types.find(t=>{ try{ return MediaRecorder.isTypeSupported(t); }catch(e){ return false; } })||'';
    const d0=new Date(), ext=/mp4/.test(mt)?'mp4':'webm', pu=safeName(p.src.kind==='g2r'?p.src.name:'Puesto '+p.n)||('Puesto '+p.n);
    const base=locStamp(d0)+'_'+pu.replace(/ /g,'_')+(p.shooter?'_'+safeName(p.shooter).replace(/ /g,'_'):'');
    let rec; try{ rec=new MediaRecorder(p.stream, mt?{mimeType:mt, videoBitsPerSecond:3000000}:{videoBitsPerSecond:3000000}); }catch(e){ log(p.label+': no se puede grabar ('+e.message+')'); return; }
    const R={rec, d0:d0.getTime(), t0:performance.now(), pausedMs:0, paused:false, mt:rec.mimeType||mt||'video/webm', ext, base, pu, chunks:[], wq:Promise.resolve(), w:null, fh:null, path:'',
      vw:p.video.videoWidth, vh:p.video.videoHeight, shooter:p.shooter||''};
    p.rec=R;
    rec.ondataavailable=e=>{ if(!e.data||!e.data.size) return; if(R.w) R.wq=R.wq.then(()=>R.w.write(e.data)).catch(err=>log(p.label+': error al escribir el vídeo '+err.message)); else R.chunks.push(e.data); };
    rec.onstop=()=>recFinish(p,R);
    rec.start(1000);
    if(await dirReady()){ try{
        const d1=await REC.dir.getDirectoryHandle(pu,{create:true}), d2=await d1.getDirectoryHandle(locStamp(d0).slice(0,8),{create:true});
        R.dir=d2; R.fh=await d2.getFileHandle(base+'.'+ext,{create:true}); const w=await R.fh.createWritable();
        R.path=REC.dir.name+'/'+pu+'/'+locStamp(d0).slice(0,8)+'/'+base+'.'+ext;
        R.wq=R.wq.then(async()=>{ for(const c of R.chunks) await w.write(c); R.chunks=[]; R.w=w; });
      }catch(e){ log(p.label+': no se pudo crear el archivo en la carpeta ('+e.message+'); se descargará al terminar'); } }
    log(p.label+': grabando la tirada'); paint(p);
  }
  function recPause(p){ const R=p.rec; if(!R||R.paused) return; try{ R.rec.pause(); }catch(e){} R.paused=true; R.pauseAt=performance.now(); }
  function recStop(p){ p.recWanted=false; const R=p.rec; if(!R) return; p.rec=null; if(R.paused){ R.pausedMs+=performance.now()-R.pauseAt; R.paused=false; }
    R.shots=p.m.S.shots.map((s,i)=>({n:i+1, ring:s.ring, dec:s.dec, manual:!!s.manual, drop:!!s.drop,
      vt:s.vt!=null?s.vt:Math.max(0,(s.t-R.d0)/1000-1.5), vx:s.vx, vy:s.vy})).filter(s=>s.vt!=null);
    R.dur=(performance.now()-R.t0-R.pausedMs)/1000; R.tot=p.m.totals();
    R.stopped=true; try{ R.rec.state!=='inactive' ? R.rec.stop() : recFinish(p,R); }catch(e){ recFinish(p,R); }
    paint(p);
  }
  async function recFinish(p,R){
    if(R.fin) return; R.fin=true;
    if(!R.stopped){ // la cámara se cortó a mitad: se guarda lo grabado y se seguirá en otro archivo al reconectar
      R.shots=p.m.S.shots.map((s,i)=>({n:i+1, ring:s.ring, dec:s.dec, manual:!!s.manual, drop:!!s.drop, vt:s.vt, vx:s.vx, vy:s.vy})).filter(s=>s.vt!=null);
      R.dur=(performance.now()-R.t0-R.pausedMs)/1000; R.tot=p.m.totals(); if(p.rec===R) p.rec=null; }
    const meta={app:'Tirofijo PC', ver:PCVER, puesto:R.pu, tirador:R.shooter||p.shooter||'', fecha:new Date(R.d0).toISOString(), mt:R.mt, vw:R.vw, vh:R.vh, dur:R.dur,
      diana:(TARGETS[p.m.S.target]||{name:'personalizada'}).name, aro1mm:p.m.targetD(), calibremm:+p.m.S.caliber||0,
      total:R.tot?R.tot.sum:0, shots:R.shots||[]};
    const json=new Blob([JSON.stringify(meta,null,1)],{type:'application/json'});
    let item={meta, name:R.base, path:R.path};
    try{
      await R.wq;
      if(R.w){ await R.w.close(); const jh=await R.dir.getFileHandle(R.base+'.json',{create:true}), jw=await jh.createWritable(); await jw.write(json); await jw.close();
        item.getVideo=()=>R.fh.getFile(); }
      else { const blob=new Blob(R.chunks,{type:R.mt}); item.getVideo=async()=>blob; dl(blob,R.base+'.'+R.ext); dl(json,R.base+'.json'); item.path='Descargas/'+R.base+'.'+R.ext; }
    }catch(e){ log(p.label+': error al cerrar la grabación: '+e.message); }
    REC.done.unshift(item); p.lastRep=item;
    msg(p,'🎬 Tirada guardada'+(item.path?': '+item.path:'')); setTimeout(()=>{ if(p.msgTxt&&p.msgTxt.startsWith('🎬')) msg(p,''); },8000);
    log(p.label+': tirada guardada '+(item.path||''));
    if(p.recWanted && !p.rec && p.m.armed) setTimeout(()=>recStart(p),500);
  }
  function dl(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),60000); }

  /* ---------- REPETICIONES: lista y visor de cada disparo (cámara lenta, fotograma a fotograma, zoom) ---------- */
  function repModal(html){ $('#repBody').innerHTML=html; $('#repModal').classList.add('open'); }
  function repCloseAll(){ const v=$('#rvVid'); if(v) v.pause(); if(RV&&RV.url) URL.revokeObjectURL(RV.url); RV=null; $('#repModal').classList.remove('open'); }
  $('#repClose').onclick=repCloseAll;
  $('#repModal').addEventListener('click',e=>{ if(e.target.id==='repModal') repCloseAll(); });
  function repItemHtml(it,i){ const m=it.meta, d=new Date(m.fecha);
    return '<div class="repItem"><div><b>'+esc(m.puesto)+(m.tirador?' · '+esc(m.tirador):'')+'</b> · '+d.toLocaleDateString('es-ES')+' '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+
      '<span class="hint">'+m.shots.length+' disparos · total '+f1(m.total||0)+' · '+Math.max(1,Math.round((m.dur||0)/60))+' min'+(it.path?' · '+esc(it.path):'')+'</span></div>'+
      '<button class="primary" data-rv="'+i+'">▶ Ver</button></div>'; }
  async function repList(){
    LIST=REC.done.slice();
    repModal('<h3>🎬 Repeticiones</h3><div class="hint">Tiradas grabadas en esta sesión'+(REC.dir?' y en la carpeta 📁 '+esc(REC.dir.name):'')+'.</div>'+
      '<div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px">'+(REC.fs?'<button id="repScan">📂 Buscar en la carpeta de grabaciones</button>':'')+
      '<label class="chk" style="align-items:center"><button id="repOpenF">📄 Abrir vídeo y .json…</button></label><input type="file" id="repFile" accept=".webm,.mp4,.json,video/*,application/json" multiple style="display:none"></div>'+
      '<div id="repItems"></div>');
    repRender();
    if($('#repScan')) $('#repScan').onclick=repScan;
    $('#repOpenF').onclick=()=>$('#repFile').click();
    $('#repFile').onchange=async e=>{ const fs=[...e.target.files], js=fs.filter(f=>/\.json$/i.test(f.name));
      for(const j of js){ try{ const meta=JSON.parse(await j.text()), b=j.name.replace(/\.json$/i,''), v=fs.find(f=>f!==j&&f.name.startsWith(b+'.'));
        if(v) LIST.unshift({meta, name:b, path:v.name, getVideo:async()=>v}); }catch(err){} }
      const lone=fs.filter(f=>!/\.json$/i.test(f.name) && !js.some(j=>f.name.startsWith(j.name.replace(/\.json$/i,'')+'.')));
      lone.forEach(v=>LIST.unshift({meta:{puesto:v.name, fecha:new Date(v.lastModified).toISOString(), shots:[], total:0, dur:0}, name:v.name, path:'', getVideo:async()=>v}));
      repRender(); };
  }
  let LIST=[];
  function repRender(){ const box=$('#repItems'); if(!box) return;
    box.innerHTML=LIST.length?LIST.map(repItemHtml).join(''):'<p class="hint" style="margin-top:12px">Aún no hay ninguna. Activa «🎬 Grabar cada tirada» en ⚙ y haz una tirada'+(REC.fs?', o busca en la carpeta.':'.')+'</p>';
    box.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>repView(LIST[+b.dataset.rv],true)); }
  async function repScan(){
    if(!(await dirReady())) return; const found=[];
    try{ for await (const [n1,h1] of REC.dir.entries()){ if(h1.kind!=='directory') continue;
        for await (const [n2,h2] of h1.entries()){ if(h2.kind!=='directory') continue;
          for await (const [n3,h3] of h2.entries()){ if(h3.kind!=='file'||!/\.json$/i.test(n3)) continue;
            try{ const meta=JSON.parse(await (await h3.getFile()).text()), b=n3.replace(/\.json$/i,'');
              let vh=null; for(const ext of ['webm','mp4']){ try{ vh=await h2.getFileHandle(b+'.'+ext); break; }catch(e){} }
              if(vh) found.push({meta, name:b, path:REC.dir.name+'/'+n1+'/'+n2+'/'+vh.name, getVideo:()=>vh.getFile()}); }catch(e){} } } } }
    catch(e){ log('No se pudo leer la carpeta: '+e.message); }
    found.sort((a,b)=>new Date(b.meta.fecha)-new Date(a.meta.fecha));
    const seen=new Set(LIST.map(i=>i.name)); LIST=LIST.concat(found.filter(f=>!seen.has(f.name)).slice(0,100)); repRender();
  }
  let RV=null;
  async function repView(it, fromList){
    if(RV&&RV.url) URL.revokeObjectURL(RV.url);
    let blob; try{ blob=await it.getVideo(); }catch(e){ repModal('<p>No se puede abrir el vídeo: '+esc(e.message)+'</p>'); return; }
    const url=URL.createObjectURL(blob), m=it.meta, shots=m.shots||[]; RV={it,url,sel:-1,rate:0.25,zoom:false,loop:true};
    repModal((fromList?'<button id="rvBack" style="margin-bottom:8px">← Repeticiones</button> ':'')+'<b>'+esc(m.puesto||'')+(m.tirador?' · '+esc(m.tirador):'')+'</b>'+
      '<div class="vwrap" id="rvWrap" style="margin-top:8px"><video id="rvVid" playsinline muted preload="auto"></video><div class="mk" id="rvMk"></div><div class="lbl" id="rvLbl">Tirada completa</div></div>'+
      '<div class="rchips" id="rvChips">'+shots.map((s,i)=>'<button data-i="'+i+'">'+(i+1)+' · '+(s.ring===0?'0':f1(s.dec))+'</button>').join('')+'<button data-i="-1">Todo</button></div>'+
      '<div class="ctl" id="rvRates"><button data-r="1">1×</button><button data-r="0.5">½×</button><button data-r="0.25">¼×</button><button data-r="0.1">Superlenta</button></div>'+
      '<div class="ctl"><button id="rvPrev">◀ fotograma</button><button id="rvPlay">⏯</button><button id="rvNext">fotograma ▶</button><button id="rvZoom">🔍 Zoom</button></div>'+
      '<p class="hint" style="margin-top:8px">Cada disparo se muestra desde 2 s antes hasta 1,5 s después y se repite. La cámara graba unos 25–30 fotogramas por segundo: el balín no suele verse en vuelo, pero sí el instante del impacto, cómo se abre el agujero y cómo reacciona la tarjeta. Teclas: ← → fotograma, espacio pausa.</p>');
    const v=$('#rvVid'); v.src=url;
    if(m.vw&&m.vh) $('#rvWrap').style.aspectRatio=m.vw+'/'+m.vh;
    // los vídeos grabados en el navegador no traen duración: se fuerza a calcularla para poder saltar a cada disparo
    v.addEventListener('loadedmetadata',()=>{ if(v.duration===Infinity||isNaN(v.duration)){ v.currentTime=1e7; v.addEventListener('timeupdate',function f(){ v.removeEventListener('timeupdate',f); v.currentTime=0; rvSel(shots.length?0:-1); }); } else rvSel(shots.length?0:-1); },{once:true});
    v.addEventListener('timeupdate',()=>{ if(RV&&RV.sel>=0&&RV.loop){ const s=shots[RV.sel]; if(v.currentTime>s.vt+1.5) v.currentTime=Math.max(0,s.vt-2); } });
    $('#rvChips').querySelectorAll('button').forEach(b=>b.onclick=()=>rvSel(+b.dataset.i));
    $('#rvRates').querySelectorAll('button').forEach(b=>b.onclick=()=>{ RV.rate=+b.dataset.r; v.playbackRate=RV.rate; rvUI(); });
    $('#rvPlay').onclick=()=>{ v.paused?v.play():v.pause(); };
    $('#rvPrev').onclick=()=>{ v.pause(); v.currentTime=Math.max(0,v.currentTime-1/30); };
    $('#rvNext').onclick=()=>{ v.pause(); v.currentTime=v.currentTime+1/30; };
    $('#rvZoom').onclick=()=>{ RV.zoom=!RV.zoom; rvUI(); };
    if($('#rvBack')) $('#rvBack').onclick=()=>{ v.pause(); const keep=LIST; repList().then(()=>{ LIST=keep; repRender(); }); };
    rvUI();
  }
  function rvSel(i){
    if(!RV) return; const v=$('#rvVid'), shots=RV.it.meta.shots||[]; RV.sel=i;
    if(i<0){ RV.zoom=false; v.playbackRate=1; v.currentTime=0; $('#rvLbl').textContent='Tirada completa'; }
    else { const s=shots[i]; v.currentTime=Math.max(0,s.vt-2); v.playbackRate=RV.rate;
      $('#rvLbl').textContent='Disparo '+(i+1)+' · '+(s.ring===0?'0 (fuera)':f1(s.dec))+(s.manual?' · manual':''); }
    v.play().catch(()=>{}); rvUI();
  }
  function rvUI(){
    if(!RV) return; const v=$('#rvVid'), m=RV.it.meta, s=RV.sel>=0?(m.shots||[])[RV.sel]:null;
    document.querySelectorAll('#rvChips button').forEach(b=>b.classList.toggle('on',+b.dataset.i===RV.sel));
    document.querySelectorAll('#rvRates button').forEach(b=>b.classList.toggle('on',+b.dataset.r===RV.rate));
    $('#rvZoom').classList.toggle('on',RV.zoom);
    const mk=$('#rvMk'), W=$('#rvWrap'), vw=m.vw||v.videoWidth, vh=m.vh||v.videoHeight;
    if(s && s.vx!=null && vw){
      const bw=W.clientWidth, bh=W.clientHeight, ar=vw/vh; let dw=bw, dh=bw/ar; if(dh>bh){ dh=bh; dw=bh*ar; }
      const px=(bw-dw)/2+s.vx*dw, py=(bh-dh)/2+s.vy*dh;
      mk.style.left=px+'px'; mk.style.top=py+'px'; v.style.transformOrigin=px+'px '+py+'px';
      v.style.transform=RV.zoom?'translate('+(bw/2-px)+'px,'+(bh/2-py)+'px) scale(3)':'none'; mk.style.display=RV.zoom?'none':'block';
    } else { mk.style.display='none'; v.style.transform='none'; }
  }
  addEventListener('keydown',e=>{ if(!RV||!$('#repModal').classList.contains('open')) return; const v=$('#rvVid');
    if(e.key==='ArrowLeft'){ v.pause(); v.currentTime=Math.max(0,v.currentTime-1/30); e.preventDefault(); }
    else if(e.key==='ArrowRight'){ v.pause(); v.currentTime+=1/30; e.preventDefault(); }
    else if(e.key===' '){ v.paused?v.play():v.pause(); e.preventDefault(); } });
  $('#repBtn').onclick=repList;
  $('#repOn').onchange=async()=>{ REC.on=$('#repOn').checked; LS('pc_rep',REC.on?'1':'0'); if(REC.on && REC.fs) await dirReady(); dirUI(); };
  $('#dirBtn').onclick=async()=>{ if(await pickDir()) REC.perm=null; dirUI(); };
  (async()=>{ try{ const h=await kv('dir'); if(h){ REC.dir=h; } }catch(e){} dirUI(); })();
  /* ---------- enfoque y exposición (solo webcams; las cámaras IP se ajustan en la propia cámara) ---------- */
  async function focusTrack(t, cmd, poi){
    if(!t) return {ok:false, why:'sin cámara'};
    let caps={}; try{ caps=t.getCapabilities?t.getCapabilities():{}; }catch(e){}
    const modes=caps.focusMode||[];
    if(!modes.length) return {ok:false, why:'esta cámara no permite controlar el enfoque'};
    const P_ = poi ? {pointsOfInterest:[{x:Math.min(1,Math.max(0,poi.x)), y:Math.min(1,Math.max(0,poi.y))}]} : {};
    let poiOk=false;
    const ap=async c=>{ try{ await t.applyConstraints({advanced:[c]}); return true; }catch(e){ return false; } };
    if(poi){ poiOk=await ap(P_);
      try{ const st=t.getSettings(); poiOk = poiOk && !!(st.pointsOfInterest && st.pointsOfInterest.length); }catch(e){ poiOk=false; } }
    if(cmd==='af'){ if(!modes.includes('continuous')) return {ok:false, why:'sin autoenfoque continuo'}; await ap(Object.assign({focusMode:'continuous'},P_)); return {ok:true, af:true, poi:poiOk}; }
    if(cmd==='manual'){ if(!modes.includes('manual')) return {ok:false, why:'no admite enfoque fijo'}; await ap({focusMode:'manual'}); return {ok:true, af:false}; }
    const prev=(t.getSettings&&t.getSettings().focusMode)||'continuous';
    if(modes.includes('single-shot')) await ap(Object.assign({focusMode:'single-shot'},P_));
    else if(modes.includes('continuous')){ if(modes.includes('manual')) await ap({focusMode:'manual'}); await ap(Object.assign({focusMode:'continuous'},P_)); }
    if(prev==='manual') setTimeout(()=>ap({focusMode:'manual'}),1500);
    else if(prev==='continuous' && modes.includes('continuous')) setTimeout(()=>ap(Object.assign({focusMode:'continuous'},P_)),1500);
    return {ok:true, poi:poiOk, af:prev!=='manual'};
  }
  async function expoTrack(t, dir){
    if(!t) return {ok:false, why:'sin cámara'};
    let caps={}, st={}; try{ caps=t.getCapabilities?t.getCapabilities():{}; st=t.getSettings?t.getSettings():{}; }catch(e){}
    const ec=caps.exposureCompensation;
    if(!ec || !(ec.max>ec.min)) return {ok:false, why:'esta cámara no permite cambiar la exposición'};
    const stp=Math.max(ec.step||0.1,(ec.max-ec.min)/12), cur=typeof st.exposureCompensation==='number'?st.exposureCompensation:0;
    const v=Math.max(ec.min,Math.min(ec.max,Math.round((cur+dir*stp)/(ec.step||0.1))*(ec.step||0.1)));
    try{ await t.applyConstraints({advanced:[{exposureMode:'continuous', exposureCompensation:v}]}); }catch(e){ return {ok:false, why:'no aceptó el cambio'}; }
    return {ok:true, val:v, min:ec.min, max:ec.max};
  }
  async function camCmd(p,a){
    const T=p.el.querySelector('.qcamT');
    if(p.src.kind!=='cam'){ T.textContent='Enfoque y exposición se ajustan en la propia cámara IP.'; return; }
    const t=p.stream&&p.stream.getVideoTracks()[0];
    if(a==='expM'||a==='expP'){ const r=await expoTrack(t,a==='expP'?1:-1);
      T.textContent=r.ok?'Exposición '+(r.val>0?'+':'')+(+r.val).toFixed(1)+' · referencia rehecha. Con luz trasera: que el papel no se vea quemado':'⚠ '+r.why;
      if(r.ok) p.m.resetRef(); return; }
    const center=a==='focusC', r=await focusTrack(t, center?'once':a==='af'?'af':'manual', center?p.m.targetCenterVid():null);
    T.textContent=!r.ok?'⚠ Enfoque: '+r.why : center?(r.poi?'⊕ Enfocado al centro de la diana':'⊕ Enfocado (esta cámara no deja elegir el punto: enfoca la zona central)')
      : r.af===false?'Enfoque fijo (no cambiará al disparar)':'Autoenfoque continuo';
  }

  function onShot(p,sh){
    if(p.rec && !p.rec.paused && sh.imp!=null) sh.vt=Math.max(0,(sh.imp-p.rec.t0-p.rec.pausedMs)/1000);
    askClose(p);
    const f=p.el.querySelector('.flash'); f.textContent=sh.ring>0?f1(sh.dec):'0'; f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
    log(p.label+(p.shooter?' ('+p.shooter+')':'')+': disparo '+p.m.S.shots.length+' → '+f1(sh.dec));
    paint(p); persist(p);
  }
  function paint(p){
    const T=p.m.totals(), S=p.m.S, el=p.el;
    el.querySelector('.last').textContent=T.last?f1(T.last.dec):'—';
    el.querySelector('.tot').textContent=f1(T.sum);
    el.querySelector('.ntir').textContent=(T.counted<T.n?T.counted+'/':'')+T.n+(T.n===1?' tiro':' tiros')+(S.shotLimit?' de '+S.shotLimit:'')+' · '+T.sumInt+' pts';
    el.classList.toggle('armed',p.m.armed);
    el.querySelector('.badge').textContent=(p.m.armed?'● DETECTANDO':'PARADO')+(p.rec?(p.rec.paused?' · REC en pausa':' · 🔴 REC'):'');
    el.querySelector('.cOut').checked=S.countOut!==false; el.querySelector('.cAsk').checked=S.askShot!==false;
    const ba=el.querySelector('[data-a="arm"]'); ba.textContent=p.m.armed?'⏸':'▶'; ba.classList.toggle('on',p.m.armed);
    el.querySelector('[data-a="type"]').textContent=S.detectType==='laser'?'🔴':'◎';
    el.querySelector('[data-a="type"]').title=S.detectType==='laser'?'Detectando láser (cambiar a cartón)':'Detectando cartón (cambiar a láser)';
    el.querySelector('.selTarget').value=TARGETS[S.target]?S.target:'custom';
    el.querySelector('.selModal').value=MODALS[S.modal]?S.modal:'issf';
    el.querySelector('.selSens').value=S.holeSens; el.querySelector('.vSens').textContent=S.holeSens;
    el.querySelector('.aro').innerHTML='aro 1 '+f1(p.m.targetD())+' mm<br>cal. '+f1(+S.caliber||0)+' mm';
    if(el.classList.contains('big')) el.querySelector('.shots').innerHTML=S.shots.map((s,i)=>'<div class="'+(s.drop?'drop':'')+(i===S.shots.length-1?' lastS':'')+'" title="'+(s.manual?'marcado a mano':'')+'">'+(s.ring===0?'0':f1(s.dec))+(s.manual?'*':'')+'</div>').join('');
  }
  function paintStatus(p){
    const s=p.m.status(), c=p.el.querySelector('.st');
    if(c.textContent!==s.txt) c.textContent=s.txt; c.className='chip st '+s.st;
    if(p.el.classList.contains('big')){ const h=p.el.querySelector('.hinfo'), t=p.m.S.detectType==='holes'?p.m.holeInfo():p.m.liveRed; if(h.textContent!==t) h.textContent=t; }
  }

  $('#grid').addEventListener('click',e=>{
    const b=e.target.closest('[data-a]'); if(!b) return;
    const p=P.find(x=>x.id===+b.closest('.tile').dataset.id); if(!p) return;
    const a=b.dataset.a, m=p.m;
    if(a==='arm'){ if(!arm(p,!m.armed) && !p.el.classList.contains('big')) setBig(p); }
    else if(a==='preGo'){ if(preApply(p)){ p.preOk=true; p.el.classList.remove('needPre'); arm(p,true); } }
    else if(['focusC','af','mf','expM','expP'].includes(a)){ camCmd(p,a); }
    else if(a==='askAdd'){ p.addNext=true; clearTimeout(p.askT); p.el.classList.add('adding'); p.el.querySelector('.askTxt').innerHTML='<b>Haz clic en la diana donde fue el disparo</b>';
      p.askT=setTimeout(()=>askClose(p),25000); return; }
    else if(a==='askZero'){ askClose(p); m.addZero(); persist(p); }
    else if(a==='askNo'){ askClose(p); }
    else if(a==='fin'){ m.armed=false; askClose(p); recStop(p); p.preOk=false; }
    else if(a==='repLast'){ if(p.lastRep) repView(p.lastRep); else { repList(); } return; }
    else if(a==='cal'){ msg(p,'Analizando la diana…'); setTimeout(()=>{ const r=m.autoCalib();
      msg(p, r.ok ? '🎯 '+r.name+(r.hint?' · '+r.hint:'')+' · comprueba los aros' : '🎯 '+r.msg);
      if(r.ok && p.src.kind==='cam') setTimeout(()=>camCmd(p,'focusC'),300);
      setTimeout(()=>{ if(p.msgTxt&&p.msgTxt.startsWith('🎯')) msg(p,''); },6000); persist(p); paint(p); },30); }
    else if(a==='type'){ m.setDetect(m.S.detectType==='laser'?'holes':'laser'); persist(p); }
    else if(a==='undo'){ if(m.undo()) persist(p); }
    else if(a==='new'){ if(!m.S.shots.length || confirm('¿Borrar los '+m.S.shots.length+' disparos de '+(p.shooter||'Puesto '+p.n)+'?')){ recStop(p); askClose(p); m.clear(); m.armed=false; p.preOk=false; persist(p); } }
    else if(a==='big'){ setBig(p.el.classList.contains('big')?null:p); }
    else if(a==='ref'){ m.resetRef(); msg(p,'Referencia rehecha'); setTimeout(()=>msg(p,''),2500); }
    else if(a==='remove'){ if(confirm('¿Quitar '+p.label+' de la galería?')){ setBig(null); removePuesto(p); } return; }
    paint(p);
  });
  function setBig(p){ P.forEach(x=>x.el.classList.toggle('big',x===p)); if(p) paint(p); }
  addEventListener('keydown',e=>{ if(e.key==='Escape') setBig(null); });

  $('#allArm').onclick=()=>{ let n=0; P.forEach(p=>{ if(!arm(p,true)) n++; });
    if(n) say(n===1?'1 puesto espera que confirmes aro 1 y calibre (⛶)':n+' puestos esperan que confirmes aro 1 y calibre (⛶)'); };
  $('#allStop').onclick=()=>{ P.forEach(p=>arm(p,false)); };
  $('#allNew').onclick=()=>{ const n=P.reduce((a,p)=>a+p.m.S.shots.length,0);
    if(n && !confirm('¿Borrar los disparos de todos los puestos ('+n+' en total)?')) return; P.forEach(p=>{ recStop(p); askClose(p); p.m.clear(); p.m.armed=false; p.preOk=false; persist(p); paint(p); }); };
  $('#cfgBtn').onclick=()=>$('#cfg').classList.toggle('hide');

  function layout(){
    const n=P.length, c=+$('#colsSel').value || (n<=1?1:n<=4?2:n<=9?3:4);
    document.documentElement.style.setProperty('--cols',c); document.documentElement.style.setProperty('--rows',Math.max(1,Math.ceil(n/c)));
    $('#empty').style.display=n?'none':'block';
    say(n?(n===1?'1 puesto':n+' puestos'):'Sin cámaras');
  }
  $('#colsSel').onchange=()=>{ LS('pc_cols',$('#colsSel').value); layout(); };
  addEventListener('resize',layout);

  /* ---------- cámaras de go2rtc ---------- */
  async function readG2r(){
    const base=$('#g2r').value.replace(/\/$/,''); LS('pc_g2r',$('#g2r').value);
    if(location.protocol==='https:' && /^http:/.test(base) && !/^http:\/\/(localhost|127\.)/.test(base)){
      say('Desde esta página (https) solo se llega a go2rtc en este mismo PC (localhost). Si go2rtc está en otro equipo, abre la página desde él.',1); return; }
    say('Leyendo cámaras…');
    try{
      const r=await fetch(base+'/api/streams'); if(!r.ok) throw new Error('go2rtc respondió '+r.status);
      const names=Object.keys(await r.json());
      if(!names.length){ say('go2rtc no tiene cámaras configuradas',1); return; }
      names.forEach(n=>addPuesto({kind:'g2r', name:n}, n));
      LS('pc_auto','1'); layout(); log('go2rtc: '+names.length+' cámaras');
    }catch(e){ say('No se puede leer go2rtc en '+base+' ('+e.message+'). ¿Está abierto go2rtc?',1); }
  }
  $('#connBtn').onclick=readG2r;

  /* ---------- webcams (para probar sin cámaras IP) ---------- */
  async function listCams(){
    try{ const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
      $('#camSel').innerHTML='<option value="">— elegir —</option>'+ds.map((d,i)=>'<option value="'+esc(d.deviceId)+'">'+esc(d.label||'Cámara '+(i+1))+'</option>').join('');
      return ds; }catch(e){ return []; }
  }
  $('#camSel').addEventListener('focus',async()=>{ const ds=await listCams();
    if(ds.length && !ds[0].label){ try{ const s=await navigator.mediaDevices.getUserMedia({video:true}); s.getTracks().forEach(t=>t.stop()); await listCams(); }catch(e){} } });
  $('#camAdd').onclick=async()=>{
    let id=$('#camSel').value;
    if(!id){ try{ const s=await navigator.mediaDevices.getUserMedia({video:true}); id=s.getVideoTracks()[0].getSettings().deviceId||''; s.getTracks().forEach(t=>t.stop()); await listCams(); }
      catch(e){ say('No se puede abrir la webcam: '+e.message,1); return; } }
    const opt=[...$('#camSel').options].find(o=>o.value===id), label=opt&&opt.value?opt.textContent:'Webcam';
    addPuesto({kind:'cam', deviceId:id, label}, label); saveList();
  };

  /* ---------- bucle: cada puesto analiza su imagen (~30 por segundo) ---------- */
  let lastF=0, lastS=0;
  function loop(t){
    requestAnimationFrame(loop);
    if(t-lastF<30) return; lastF=t;
    for(const p of P){ if(p.stream && p.video.readyState>=2){ try{ p.m.step(); }catch(e){ if(!p.errLogged){ p.errLogged=1; log(p.label+': '+e.message); } } } }
    if(t-lastS>300){ lastS=t; P.forEach(paintStatus); }
  }
  requestAnimationFrame(loop);

  // la pantalla del PC no se apaga mientras la galería está abierta
  async function wake(){ try{ if(navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){} }
  wake(); document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') wake(); });
  addEventListener('beforeunload',e=>{ P.forEach(persist); if(P.some(p=>p.rec)){ P.forEach(recStop); e.preventDefault(); e.returnValue=''; } });

  // arranque: webcams guardadas y, si ya se usó, las cámaras de go2rtc
  try{ (JSON.parse(LS('pc_cams')||'[]')||[]).forEach(s=>addPuesto(s, s.label||'Webcam')); }catch(e){}
  const autoG=LS('pc_auto')==='1' || servedByG2r;     // abierta desde go2rtc: lee las cámaras sola
  if(autoG) readG2r();
  if(P.length || autoG) $('#cfg').classList.add('hide');
  layout();
})();
</script>
</body>
